name: OTA27Blocker
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
targets:
  OTA27Blocker:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: CinderLab/Sources
      - path: CinderLab/seeds/joliet_path_oob.iso
        buildPhase: resources
      - path: CinderLab/seeds/deep_nest.usda
        buildPhase: resources
      - path: CinderLab/seeds/stack_bomb.cff
        buildPhase: resources
      - path: CinderLab/seeds/ktx2_bad_dims.ktx2
        buildPhase: resources
      - path: CinderLab/seeds/bc7_short.dds
        buildPhase: resources
      - path: CinderLab/Seeds/joliet_path_oob.iso
        buildPhase: resources
      - path: CinderLab/Seeds/deep_nest.usda
        buildPhase: resources
      - path: CinderLab/Seeds/stack_bomb.cff
        buildPhase: resources
      - path: CinderLab/Seeds/ktx2_bad_dims.ktx2
        buildPhase: resources
      - path: CinderLab/Seeds/bc7_short.dds
        buildPhase: resources
      - path: CinderLab/CinderPOCs.zip
        buildPhase: resources
      - path: Resources/blockota.mobileconfig
        buildPhase: resources
    dependencies:
      - framework: Dependencies/AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: OTA27Blocker
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.ota27blocker
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        OTHER_LDFLAGS: "-lc++ -Wl,-u,_ALGetGrappaToken -Wl,-exported_symbol,_ALGetGrappaToken"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
schemes:
  OTA27Blocker:
    build:
      targets:
        OTA27Blocker: all
