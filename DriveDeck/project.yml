name: DriveDeck
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  DriveDeck:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.drivedeck
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DriveDeck
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "20"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: false
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryUsageDescription: "Choose a custom logo for DriveDeck."
        NSLocalNetworkUsageDescription: "Discover and pair nearby DriveDeck devices, and inspect CarPlay/AirPlay services on your own Wi-Fi network."
        NSBonjourServices:
          - "_drivedeck._tcp"
          - "_ddcast._tcp"
          - "_carplay-ctrl._tcp"
          - "_airplay._tcp"
          - "_raop._tcp"
          - "_carcast-hu._tcp"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
