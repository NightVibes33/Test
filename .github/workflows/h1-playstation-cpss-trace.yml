name: PlayStation Session Share BFF auth checks

on:
  push:
    branches:
      - h1-playstation-session-share

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check unauthenticated BFF enforcement
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://session-share.playstation.com'
          UA='Mozilla/5.0 HackerOne-security-research'

          probe() {
            name="$1"; shift
            echo "=== $name ==="
            rm -f /tmp/h /tmp/b
            curl -sS --max-time 20 --connect-timeout 10 -A "$UA" \
              -D /tmp/h -o /tmp/b -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download} REDIR=%{redirect_url}\n' \
              "$@" || true
            sed -n '1,30p' /tmp/h
            python3 - <<'PY'
          import json
          b=open('/tmp/b','rb').read() if __import__('os').path.exists('/tmp/b') else b''
          print('BODY_PREFIX',repr(b[:800]))
          try:
              x=json.loads(b)
              if isinstance(x,dict):
                  print('JSON_KEYS',sorted(x.keys()))
                  # avoid dumping possible device data
                  safe={}
                  for k,v in x.items():
                      if k.lower() in ('error','reason','message','success','status','code'):
                          safe[k]=v
                      elif k=='clients' and isinstance(v,list):
                          safe['clients_count']=len(v)
                          safe['client_keys']=sorted(set().union(*(set(i.keys()) for i in v if isinstance(i,dict)))) if v else []
                  print('SAFE_JSON',json.dumps(safe)[:2000])
          except Exception:
              pass
          PY
          }

          probe clientsList "$BASE/clientsList"
          probe clientsList_options -X OPTIONS "$BASE/clientsList" \
            -H 'Origin: https://example.com' \
            -H 'Access-Control-Request-Method: GET'

          # Intentionally invalid/empty body: cannot identify a device or issue a valid command.
          probe postcommand_empty -X POST "$BASE/postcommand" \
            -H 'Content-Type: application/json' --data '{}'
          probe postcommand_text_plain -X POST "$BASE/postcommand" \
            -H 'Content-Type: text/plain' --data '{}'
          probe postcommand_options -X OPTIONS "$BASE/postcommand" \
            -H 'Origin: https://example.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'

          # Bogus command id cannot match a real command.
          probe observe_bogus -X POST "$BASE/observeTitle" \
            -H 'Content-Type: application/json' --data '{"commandID":"00000000-0000-0000-0000-000000000000"}'
          probe observe_options -X OPTIONS "$BASE/observeTitle" \
            -H 'Origin: https://example.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'
