name: PlayStation Session Share CPSS auth-flag check

on:
  push:
    branches:
      - h1-playstation-session-share

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare unauthenticated CPSS responses
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 HackerOne-security-research'
          BASE='https://web.np.playstation.com/api/cpss/v1/sessionInfo'

          python3 - <<'PY'
          import subprocess,json,hashlib,re
          ids=['Lq3djkxt','5kBbS_pU_']
          variants=[('false','isAuth=false'),('true','isAuth=true'),('absent','')]
          for sid in ids:
              print('\n=== SESSION',sid,'===')
              results={}
              for label,q in variants:
                  url=f'https://web.np.playstation.com/api/cpss/v1/sessionInfo/{sid}?country=US&language=en'
                  if q: url += '&'+q
                  p=subprocess.run([
                      'curl','-sS','-L','--max-time','20','--connect-timeout','10',
                      '-A','Mozilla/5.0 HackerOne-security-research',
                      '-H','Accept: application/json',
                      '-w','\n__META__%{http_code}|%{content_type}|%{size_download}',
                      url
                  ],capture_output=True,text=True)
                  raw=p.stdout
                  body,meta=(raw.rsplit('\n__META__',1)+[''])[:2] if '\n__META__' in raw else (raw,'')
                  h=hashlib.sha256(body.encode()).hexdigest()
                  print(label,'META',meta,'SHA256',h,'LEN',len(body))
                  try:
                      obj=json.loads(body)
                      if isinstance(obj,dict):
                          keys=sorted(obj.keys())
                          print(label,'TOP_KEYS',keys)
                          safe={}
                          for k,v in obj.items():
                              lk=k.lower()
                              if lk in ('id','insession','isopen','mspollinginterval','maxplayers','timestarted','timeended','country','language'):
                                  safe[k]=v
                              elif lk=='game' and isinstance(v,dict):
                                  safe['game_keys']=sorted(v.keys())
                                  plats=v.get('platforms')
                                  if isinstance(plats,list):
                                      safe['platform_count']=len(plats)
                                      safe['platform_ids']=[x.get('id') for x in plats if isinstance(x,dict)]
                                      safe['has_launch_urls']=any(bool(x.get('launchUrl')) for x in plats if isinstance(x,dict))
                              elif lk=='players' and isinstance(v,list):
                                  safe['player_count']=len(v)
                                  safe['player_item_keys']=sorted(set().union(*(set(x.keys()) for x in v if isinstance(x,dict)))) if v else []
                              elif lk=='error':
                                  safe['error']=v
                              elif lk=='reason':
                                  safe['reason']=v
                          print(label,'SAFE_SUMMARY',json.dumps(safe,sort_keys=True)[:3000])
                      else:
                          print(label,'JSON_TYPE',type(obj).__name__)
                  except Exception:
                      print(label,'BODY_PREFIX',repr(body[:300]))
                  results[label]=(meta,h,len(body))
              print('COMPARE false_vs_true',results.get('false')==results.get('true'))
              print('COMPARE false_vs_absent',results.get('false')==results.get('absent'))
          PY
