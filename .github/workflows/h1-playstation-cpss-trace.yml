name: PlayStation Session Share CPSS trace

on:
  push:
    branches:
      - h1-playstation-session-share

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print only CPSS and JoinCTA implementation
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 HackerOne-security-research'
          PAGE='https://session-share.playstation.com/5kBbS_pU_'
          curl -sS -L --max-time 20 --connect-timeout 10 -A "$UA" "$PAGE" -o page.html
          python3 - <<'PY'
          import re,html
          from urllib.parse import urljoin,urlparse
          h=open('page.html','r',encoding='utf-8',errors='replace').read()
          urls=[]
          for pat in [r'<script[^>]+src=["\x27]([^"\x27]+)',r'<link[^>]+href=["\x27]([^"\x27]+)']:
              for m in re.finditer(pat,h,re.I):
                  u=urljoin('https://session-share.playstation.com/',html.unescape(m.group(1)))
                  if urlparse(u).path.endswith('.js') and u not in urls: urls.append(u)
          open('urls.txt','w').write('\n'.join(urls))
          PY
          mkdir -p js
          i=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1))
            curl -sS -L --max-time 20 --connect-timeout 10 -A "$UA" "$u" -o "js/$i.js"
          done < urls.txt

          python3 - <<'PY'
          import glob,re,os
          alltext=[]
          for f in sorted(glob.glob('js/*.js')):
              t=open(f,'r',encoding='utf-8',errors='replace').read()
              alltext.append((f,t))

          def show(term,before=2500,after=7000,maxhits=5):
              print('\n########',term,'########')
              n=0
              for f,t in alltext:
                  start=0
                  while n<maxhits:
                      i=t.lower().find(term.lower(),start)
                      if i<0: break
                      lo=max(0,i-before); hi=min(len(t),i+after)
                      s=t[lo:hi].replace('\n',' ')
                      s=re.sub(r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}','<JWT_REDACTED>',s)
                      print('FILE',os.path.basename(f),'OFFSET',i)
                      print(s)
                      print('---END---')
                      n+=1; start=i+len(term)
                  if n>=maxhits: break

          show('async function cpssRequest',3500,10000,2)
          show('function cpssRequest',3500,10000,2)
          show('let JoinCTA=',3500,10000,2)
          show('JoinCTA=e=>',3500,10000,2)
          show('steampowered.com/join/playstationsession',2500,6000,2)
          show('SessionProvider=e=>',3000,8000,2)
          PY
