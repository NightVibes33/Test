name: WordPress cross-parent note PoC

on:
  push:
    branches:
      - wp-notes-cross-parent-poc

permissions:
  contents: read

jobs:
  prepare-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare WordPress PHPUnit overlay
        run: |
          mkdir -p overlay/tests/phpunit/tests/rest-api
          cp wp-h1-tests/wp-notes-cross-parent.php overlay/tests/phpunit/tests/rest-api/wp-notes-cross-parent.php
      - name: Upload test overlay
        uses: actions/upload-artifact@v4
        with:
          name: wp-notes-cross-parent-overlay
          path: overlay
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: prepare-overlay
    uses: WordPress/wordpress-develop/.github/workflows/reusable-phpunit-tests-v3.yml@trunk
    with:
      repository: WordPress/wordpress-develop
      ref: trunk
      php: '8.4'
      phpunit-test-groups: wp-notes-cross-parent
      overlay-artifact: wp-notes-cross-parent-overlay
