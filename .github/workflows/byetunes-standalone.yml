name: Build MP3 Skull IPA
on:
  push:
    branches: ['temp/byetunes-standalone']
    paths:
      - 'byetunes-standalone/**'
      - '.github/workflows/byetunes-standalone.yml'
  workflow_dispatch:
concurrency:
  group: mp3-skull-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Stage MP3 Skull custom sources and compile pairing runtime
        run: |
          set -o pipefail
          python3 -m py_compile byetunes-standalone/standalone.py
          bash byetunes-standalone/prepare.sh 2>&1 | tee byetunes-standalone/prepare.log
      - name: Build native iOS app
        working-directory: byetunes-standalone
        run: |
          set -eo pipefail
          xcodebuild -project ByeTunes/MusicManager.xcodeproj -scheme MusicManager -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build 2>&1 | tee build.log
      - name: Package unsigned IPA
        working-directory: byetunes-standalone
        run: |
          set -euxo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/MP3 Skull.app"
          test -f "$APP/MP3 Skull"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = "com.nightvibes33.mp3skull"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist")" = "MP3 Skull"
          xcrun lipo -verify_arch arm64 "$APP/MP3 Skull"
          test -f "$APP/Assets.car"
          test -d "$APP/PlugIns/MusicManagerLiveActivity.appex"
          mkdir -p dist/Payload
          ditto "$APP" "dist/Payload/MP3 Skull.app"
          (cd dist && zip -qry MP3-Skull-unsigned.ipa Payload && shasum -a 256 MP3-Skull-unsigned.ipa > SHA256SUMS)
          unzip -t dist/MP3-Skull-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MP3-Skull-unsigned
          path: |
            byetunes-standalone/dist/MP3-Skull-unsigned.ipa
            byetunes-standalone/dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MP3-Skull-build-log
          path: |
            byetunes-standalone/prepare.log
            byetunes-standalone/build.log
          if-no-files-found: ignore
