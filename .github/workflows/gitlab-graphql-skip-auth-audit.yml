name: GitLab 19.4.1 GraphQL Skip-Authorization Audit

on:
  push:
    branches:
      - h1-gitlab-graphql-skip-auth-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact GitLab release
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v19.4.1-ee https://gitlab.com/gitlab-org/gitlab.git gitlab
          cd gitlab
          git rev-parse HEAD | tee ../gitlab-revision.txt
          git describe --tags --exact-match | tee ../gitlab-tag.txt

      - name: Find skipped GraphQL object authorization
        shell: bash
        run: |
          set -o pipefail
          cd gitlab
          {
            echo "=== skip_type_authorization ==="
            git grep -n -C 25 "skip_type_authorization" -- 'app/graphql/**' 'ee/app/graphql/**' || true
            echo
            echo "=== types declared authorized by resolver ==="
            git grep -n -C 20 "Graphql/AuthorizeTypes -- authorized by resolver" -- 'app/graphql/**' 'ee/app/graphql/**' || true
            echo
            echo "=== resolver-side property shortcut patterns ==="
            git grep -n -C 18 -E "return true if .*==|return true if .*same|\.select \{.*Ability\.allowed|next unless .*Ability\.allowed" -- 'app/graphql/resolvers/**' 'ee/app/graphql/resolvers/**' || true
            echo
            echo "=== MergeRequests::LinkedWorkItemType ==="
            sed -n '1,180p' app/graphql/types/merge_requests/linked_work_item_type.rb
            echo
            echo "=== resolvers/fields returning MergeRequests::LinkedWorkItemType ==="
            git grep -n -C 30 "MergeRequests::LinkedWorkItemType" -- 'app/graphql/**' 'ee/app/graphql/**' || true
            echo
            echo "=== linked work item MR resolver candidates ==="
            git grep -n -C 30 -E "linked_work_item|LinkedWorkItem" -- 'app/graphql/resolvers/**' 'ee/app/graphql/resolvers/**' || true
          } | tee ../graphql-skip-auth-audit.log

      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-graphql-skip-auth-audit
          path: |
            gitlab-revision.txt
            gitlab-tag.txt
            graphql-skip-auth-audit.log
