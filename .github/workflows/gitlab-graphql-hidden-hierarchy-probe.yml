name: GitLab 19.4.1 GraphQL Hidden Hierarchy Probe

on:
  push:
    branches:
      - h1-gitlab-graphql-hidden-hierarchy-counts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: registry.gitlab.com/gitlab-org/gitlab-build-images/ci/debian-trixie-slim-ruby-3.3.12-golang-1.25-node-22.12-python-3.12-postgresql-17:rubygems-3.6-git-2.51-lfs-2.9-chrome-151-yarn-1.22-graphicsmagick-1.3.36-poetry-2.2
    services:
      postgres:
        image: registry.gitlab.com/gitlab-org/gitlab-build-images:postgres-17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:7.2-alpine
    env:
      RAILS_ENV: test
      NODE_ENV: test
      POSTGRES_HOST_AUTH_METHOD: trust
      USE_REDIS_CLUSTER: "false"
      DECOMPOSED_DB: "false"
      CI_JOB_NAME: "rspec graphql hidden hierarchy probe"
      BUNDLE_WITHOUT: ""
      SETUP_DB: "true"
      GITLAB_TEST_EAGER_LOAD: "0"

    steps:
      - name: Clone exact GitLab release
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v19.4.1-ee https://gitlab.com/gitlab-org/gitlab.git gitlab
          cd gitlab
          git rev-parse HEAD | tee ../gitlab-revision.txt
          git describe --tags --exact-match | tee ../gitlab-tag.txt

      - name: Add focused hierarchy probe
        shell: bash
        run: |
          set -euxo pipefail
          cat > gitlab/spec/requests/api/graphql/work_item_hidden_hierarchy_security_spec.rb <<'RUBY'
          # frozen_string_literal: true

          require 'spec_helper'

          RSpec.describe 'GraphQL hidden WorkItem hierarchy metadata', feature_category: :team_planning do
            include GraphqlHelpers

            let_it_be(:banned_author) { create(:user, :banned) }
            let_it_be(:group) { create(:group, :public) }
            let_it_be(:parent_item) { create(:work_item, :epic, namespace: group, title: 'H1-HIER-PARENT') }
            let_it_be(:hidden_child) do
              create(
                :work_item,
                :epic,
                namespace: group,
                author: banned_author,
                title: 'H1-HIER-HIDDEN-CHILD-71e4a9'
              )
            end
            let_it_be(:parent_link) do
              create(:parent_link, work_item: hidden_child, work_item_parent: parent_item)
            end

            let(:fields) do
              <<~GRAPHQL
                id
                title
                features {
                  hierarchy {
                    hasChildren
                    rolledUpCountsByType {
                      workItemType { id name }
                      countsByState { all opened closed }
                    }
                    children {
                      nodes {
                        id
                        title
                        hidden
                      }
                    }
                  }
                }
              GRAPHQL
            end

            let(:query) do
              graphql_query_for('workItem', { 'id' => parent_item.to_global_id.to_s }, fields)
            end

            before do
              stub_licensed_features(epics: true)
            end

            it 'compares authorized children with raw hierarchy metadata' do
              expect(hidden_child.hidden?).to be(true)
              expect(Ability.allowed?(nil, :read_work_item, hidden_child)).to be(false)

              post_graphql(query, current_user: nil)

              hierarchy = graphql_data.dig('workItem', 'features', 'hierarchy')
              puts "HIER_PROBE hidden=#{hidden_child.hidden?} allowed=#{Ability.allowed?(nil, :read_work_item, hidden_child)}"
              puts "HIER_PROBE hierarchy=#{hierarchy.inspect}"
              puts "HIER_PROBE errors=#{json_response['errors'].inspect}"

              expect(graphql_data.dig('workItem', 'id')).to eq(parent_item.to_global_id.to_s)
            end
          end
          RUBY

      - name: Prepare GitLab test environment
        shell: bash
        run: |
          set -euxo pipefail
          cd gitlab
          bash -lc '. scripts/prepare_build.sh' 2>&1 | tee ../prepare-build.log

      - name: Run hierarchy probe
        shell: bash
        run: |
          set -o pipefail
          cd gitlab
          bin/rspec spec/requests/api/graphql/work_item_hidden_hierarchy_security_spec.rb --format documentation 2>&1 | tee ../probe.log

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-graphql-hidden-hierarchy-probe
          if-no-files-found: warn
          path: |
            gitlab-revision.txt
            gitlab-tag.txt
            prepare-build.log
            probe.log
            gitlab/spec/requests/api/graphql/work_item_hidden_hierarchy_security_spec.rb
