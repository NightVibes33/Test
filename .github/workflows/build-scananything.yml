name: Build ScanAnything

on:
  push:
    branches:
      - scananything
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ipa:
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version || brew install cmake

      - name: Build msplat for iOS
        run: |
          chmod +x Vendor/msplat-ios/scripts/build-xcframework.sh
          BUILD_JOBS=3 Vendor/msplat-ios/scripts/build-xcframework.sh

      - name: Resolve packages
        run: |
          xcodebuild \
            -project ObjectScanner.xcodeproj \
            -scheme ObjectScanner \
            -resolvePackageDependencies

      - name: Build unsigned app
        run: |
          set -o pipefail
          rm -rf DerivedData
          xcodebuild \
            -project ObjectScanner.xcodeproj \
            -scheme ObjectScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          rm -rf Payload ScanAnything-unsigned.ipa
          mkdir Payload
          ditto "$APP" "Payload/$(basename "$APP")"
          /usr/bin/zip -qry ScanAnything-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: ScanAnything-unsigned
          path: ScanAnything-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ScanAnything-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
