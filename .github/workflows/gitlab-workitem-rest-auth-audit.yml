name: GitLab 19.4.1 Work Item REST Auth Audit

on:
  push:
    branches:
      - h1-gitlab-workitem-rest-auth-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact GitLab release
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v19.4.1-ee https://gitlab.com/gitlab-org/gitlab.git gitlab
          cd gitlab
          git rev-parse HEAD | tee ../gitlab-revision.txt
          git describe --tags --exact-match | tee ../gitlab-tag.txt

      - name: Audit Work Item REST authorization
        shell: bash
        run: |
          set -o pipefail
          cd gitlab
          {
            echo "=== work_item_rest_api references ==="
            git grep -n -C 8 "work_item_rest_api" -- 'lib/api/**' 'app/**' || true
            echo
            echo "=== read_work_item authorization calls ==="
            git grep -n -C 12 "read_work_item" -- 'lib/api/**' || true
            echo
            echo "=== parent_work_item helpers ==="
            git grep -n -C 12 "parent_work_item" -- 'lib/api/**' || true
            echo
            echo "=== linked_items REST references ==="
            git grep -n -C 12 "linked_items" -- 'lib/api/**' || true
          } | tee ../workitem-rest-auth-audit.log

      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-workitem-rest-auth-audit
          path: |
            gitlab-revision.txt
            gitlab-tag.txt
            workitem-rest-auth-audit.log
