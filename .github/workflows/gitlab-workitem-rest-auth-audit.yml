name: GitLab 19.4.1 Work Item REST Auth Audit

on:
  push:
    branches:
      - h1-gitlab-workitem-rest-auth-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact GitLab release
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v19.4.1-ee https://gitlab.com/gitlab-org/gitlab.git gitlab
          cd gitlab
          git rev-parse HEAD | tee ../gitlab-revision.txt
          git describe --tags --exact-match | tee ../gitlab-tag.txt

      - name: Audit Work Item REST authorization
        shell: bash
        run: |
          set -o pipefail
          cd gitlab
          {
            echo "=== authorization helper ==="
            sed -n '1,260p' lib/api/helpers/work_items/authorization.rb
            echo
            echo "=== rendering helper ==="
            sed -n '1,220p' lib/api/helpers/work_items/rendering.rb
            echo
            echo "=== preloads helper ==="
            sed -n '140,220p' lib/api/helpers/work_items/preloads.rb
            echo
            echo "=== linked_items route ==="
            sed -n '1,180p' lib/api/work_items/linked_items.rb
            echo
            echo "=== work_item_for helper definitions ==="
            git grep -n -C 20 "def work_item_for" -- 'lib/api/**' || true
          } | tee ../workitem-rest-auth-audit.log

      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-workitem-rest-auth-audit
          path: |
            gitlab-revision.txt
            gitlab-tag.txt
            workitem-rest-auth-audit.log
