name: GitLab 19.4.1 Namespace Ban Source Audit

on:
  push:
    branches:
      - h1-gitlab-namespace-ban-source-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact GitLab release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v19.4.1-ee https://gitlab.com/gitlab-org/gitlab.git gitlab
          cd gitlab
          echo "REVISION=$(git rev-parse HEAD)"
          echo "TAG=$(git describe --tags --exact-match)"

      - name: Inspect namespace ban factories and specs
        run: |
          set -o pipefail
          cd gitlab
          grep -RIn --exclude-dir=.git -E 'factory.*namespace_ban|create\(:namespace_ban|banned_from_namespace\?|unique_project_download_limit_enabled' ee/spec spec ee/app app 2>/dev/null | head -n 1200
