name: GitLab 19.4.1 Encoded Diff Guard Probe

on:
  push:
    branches:
      - h1-gitlab-encoded-diff-guard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    container:
      image: registry.gitlab.com/gitlab-org/gitlab-build-images/ci/debian-trixie-slim-ruby-3.3.12-golang-1.25-node-22.12-python-3.12-postgresql-17:rubygems-3.6-git-2.51-lfs-2.9-chrome-151-yarn-1.22-graphicsmagick-1.3.36-poetry-2.2

    services:
      postgres:
        image: registry.gitlab.com/gitlab-org/gitlab-build-images:postgres-17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:7.2-alpine

    env:
      RAILS_ENV: test
      NODE_ENV: test
      POSTGRES_HOST_AUTH_METHOD: trust
      USE_REDIS_CLUSTER: "false"
      DECOMPOSED_DB: "false"
      CI_JOB_NAME: "rspec encoded diff guard probe"
      BUNDLE_WITHOUT: ""
      SETUP_DB: "true"
      GITLAB_TEST_EAGER_LOAD: "0"

    steps:
      - name: Clone exact GitLab release
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v19.4.1-ee https://gitlab.com/gitlab-org/gitlab.git gitlab
          cd gitlab
          git rev-parse HEAD | tee ../gitlab-revision.txt
          git describe --tags --exact-match | tee ../gitlab-tag.txt

      - name: Add focused encoded-path probe
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p gitlab/spec/lib/gitlab/diff
          cat > gitlab/spec/lib/gitlab/diff/encoded_diff_path_probe_spec.rb <<'RUBY'
          # frozen_string_literal: true

          require 'spec_helper'
          require 'open3'
          require 'json'

          RSpec.describe 'Encoded diff path traversal guard probe', feature_category: :code_review_workflow do
            let_it_be(:project) { create(:project, :repository) }

            it 'prints detector and browser-normalization behavior for encoded dot segments' do
              encoded_path = 'x/%2e%2e/%2e%2e/%2e%2e/%2e%2e/raw/main'
              detector = Gitlab::PathTraversal.path_traversal?(encoded_path)

              generated_path = Gitlab::Routing.url_helpers.project_blob_path(
                project,
                File.join('deadbeef', encoded_path)
              )

              script = <<~'JS'
                const input = process.argv[1];
                const u = new URL(input, 'https://gitlab.example.com');
                process.stdout.write(JSON.stringify({ href: u.href, pathname: u.pathname }));
              JS
              output, status = Open3.capture2('node', '-e', script, generated_path)
              expect(status.success?).to be(true)
              browser = Gitlab::Json.parse(output)

              puts "ENCODED_GUARD detector=#{detector.inspect}"
              puts "ENCODED_GUARD raw=#{encoded_path}"
              puts "ENCODED_GUARD generated=#{generated_path}"
              puts "ENCODED_GUARD browser_href=#{browser['href']}"
              puts "ENCODED_GUARD browser_pathname=#{browser['pathname']}"

              expect(generated_path).to be_present
              expect(browser['pathname']).to be_present
            end
          end
          RUBY

      - name: Prepare GitLab test environment
        shell: bash
        run: |
          set -euxo pipefail
          cd gitlab
          bash -lc '. scripts/prepare_build.sh' 2>&1 | tee ../prepare-build.log

      - name: Run encoded-path probe
        shell: bash
        run: |
          set -o pipefail
          cd gitlab
          bin/rspec spec/lib/gitlab/diff/encoded_diff_path_probe_spec.rb --format documentation 2>&1 | tee ../probe.log

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-encoded-diff-guard-probe
          if-no-files-found: warn
          path: |
            gitlab-revision.txt
            gitlab-tag.txt
            prepare-build.log
            probe.log
            gitlab/spec/lib/gitlab/diff/encoded_diff_path_probe_spec.rb
