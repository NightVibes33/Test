name: Django cache regression

on:
  workflow_dispatch:
  push:
    branches:
      - h1-django-raw-set-cookie-cache-bypass

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install current Django release
        run: python -m pip install "Django==6.1.1"
      - name: Run regression test
        run: python django-cache-regression.py | tee django-cache-evidence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: django-cache-evidence
          path: django-cache-evidence.txt
