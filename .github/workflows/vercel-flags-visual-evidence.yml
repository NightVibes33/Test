name: Vercel Flags replay reproduction

on:
  push:
    branches:
      - h1-vercel-flags-precompute-context-replay
  workflow_dispatch:

jobs:
  reproduction:
    runs-on: ubuntu-22.04
    env:
      FLAGS_SECRET: Q0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0M
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app, Chromium, and desktop capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xterm fluxbox ffmpeg xdotool
          cd security/vercel-flags-precompute-replay/e2e
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Production build
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          npm run build

      - name: Start production server
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          npm run start > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          ready=0
          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          echo "production_server_ready=true"

      - name: Record terminal and Chromium reproduction
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          rm -rf evidence-real
          mkdir -p evidence-real
          rm -f /tmp/h1-phase-* /tmp/h1-browser-* /tmp/h1-proof-done

          cat > proof-terminal.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          ORIGIN="http://127.0.0.1:3000"

          clear
          printf 'VERCEL FLAGS PRECOMPUTE REPLAY\n'
          printf '================================\n\n'
          printf '$ node --version\n'
          node --version
          printf '$ npm ls flags next --depth=0\n'
          npm ls flags next --depth=0 || true
          printf '\n'

          printf '$ curl -fsS %s/\n' "$ORIGIN"
          ROOT_HTML="$(curl -fsS "$ORIGIN/")"
          ROOT_RENDERED="$(printf '%s' "$ROOT_HTML" | sed 's/<!-- -->//g' | grep -o 'navigation=[^<]*' | head -1)"
          printf 'rendered_result=%s\n' "$ROOT_RENDERED"

          TOKEN="$(printf '%s' "$ROOT_HTML" | grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+' | head -1)"
          test -n "$TOKEN"
          TOKEN_SHA="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          printf 'source_token_sha256=%s\n' "$TOKEN_SHA"
          printf 'source_token=%s\n' "$TOKEN"
          printf '%s' "$TOKEN" > /tmp/h1-source-token
          printf '%s' "$TOKEN_SHA" > /tmp/h1-source-sha
          touch /tmp/h1-phase-1
          while [ ! -e /tmp/h1-browser-1 ]; do sleep 0.1; done

          printf '\n$ curl -fsS %s/pricing\n' "$ORIGIN"
          BASE_HTML="$(curl -fsS "$ORIGIN/pricing")"
          BASE_RENDERED="$(printf '%s' "$BASE_HTML" | sed 's/<!-- -->//g' | grep -o 'navigation=[^<]*;discount=[^<]*' | head -1)"
          printf 'baseline_result=%s\n' "$BASE_RENDERED"
          printf '%s' "$BASE_RENDERED" | grep -q 'discount=none'
          touch /tmp/h1-phase-2
          while [ ! -e /tmp/h1-browser-2 ]; do sleep 0.1; done

          REPLAY_URL="$ORIGIN/$TOKEN/pricing/$TOKEN"
          printf '\nReplay the same signed token in the pricing position\n'
          printf 'source_token_sha256=%s\n' "$TOKEN_SHA"
          printf 'token_modified=false\n'
          printf '$ curl -fsS "%s"\n' "$REPLAY_URL"
          REPLAY_HTML="$(curl -fsS "$REPLAY_URL")"
          REPLAY_RENDERED="$(printf '%s' "$REPLAY_HTML" | sed 's/<!-- -->//g' | grep -o 'navigation=[^<]*;discount=[^<]*' | head -1)"
          printf 'replay_result=%s\n' "$REPLAY_RENDERED"
          printf '%s' "$REPLAY_RENDERED" | grep -q 'discount=vip'
          printf 'same_token_used_for_root_and_pricing=true\n'
          printf 'result=discount_changed_after_replay\n'
          printf '%s' "$REPLAY_URL" > /tmp/h1-replay-url
          touch /tmp/h1-phase-3
          while [ ! -e /tmp/h1-browser-3 ]; do sleep 0.1; done

          printf '\nReproduction complete.\n'
          sleep 5
          touch /tmp/h1-proof-done
          BASH
          chmod +x proof-terminal.sh

          cat > proof-browser.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const origin = 'http://127.0.0.1:3000';

          async function waitFile(path) {
            while (!fs.existsSync(path)) {
              await new Promise(r => setTimeout(r, 100));
            }
          }

          const browser = await chromium.launch({
            headless: false,
            args: [
              '--window-position=810,0',
              '--window-size=790,900',
              '--no-sandbox',
              '--disable-dev-shm-usage',
            ],
          });
          const context = await browser.newContext({ viewport: null });
          const page = await context.newPage();

          await waitFile('/tmp/h1-phase-1');
          await page.goto(origin + '/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(2200);
          fs.writeFileSync('/tmp/h1-browser-1', 'ok');

          await waitFile('/tmp/h1-phase-2');
          await page.goto(origin + '/pricing', { waitUntil: 'networkidle' });
          await page.waitForTimeout(2600);
          fs.writeFileSync('/tmp/h1-browser-2', 'ok');

          await waitFile('/tmp/h1-phase-3');
          const replayURL = fs.readFileSync('/tmp/h1-replay-url', 'utf8');
          await page.goto(replayURL, { waitUntil: 'networkidle' });
          await page.waitForTimeout(5000);
          fs.writeFileSync('/tmp/h1-browser-3', 'ok');

          await waitFile('/tmp/h1-proof-done');
          await page.screenshot({
            path: 'evidence-real/final-live-browser.png',
            fullPage: true,
          });
          await browser.close();
          NODE

          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x900x24 > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 1
          fluxbox > /tmp/fluxbox.log 2>&1 &
          FLUXBOX_PID=$!
          sleep 2

          ffmpeg -y -loglevel warning \
            -f x11grab -framerate 30 -video_size 1600x900 -i :99.0 \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            evidence-real/vercel-flags-replay-reproduction.mp4 \
            > /tmp/ffmpeg.log 2>&1 &
          FFMPEG_PID=$!

          xterm \
            -geometry 92x47+0+0 \
            -fa Monospace -fs 11 \
            -bg black -fg white \
            -title "Vercel Flags reproduction" \
            -hold -e bash ./proof-terminal.sh &
          XTERM_PID=$!

          node proof-browser.mjs

          kill -INT "$FFMPEG_PID" || true
          wait "$FFMPEG_PID" || true
          kill "$XTERM_PID" || true
          kill "$FLUXBOX_PID" || true
          kill "$XVFB_PID" || true

          test -s evidence-real/vercel-flags-real-terminal-browser-proof.mp4
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            evidence-real/vercel-flags-real-terminal-browser-proof.mp4

          printf 'SOURCE=continuous X11 desktop recording\n' > evidence-real/manifest.txt
          printf 'terminal=xterm executing real curl/hash commands\n' >> evidence-real/manifest.txt
          printf 'browser=headed Chromium driven against local production Next.js server\n' >> evidence-real/manifest.txt
          printf 'video=ffmpeg x11grab of DISPLAY :99\n' >> evidence-real/manifest.txt
          printf 'editing=none\n' >> evidence-real/manifest.txt
          printf 'synthetic_frames=none\n' >> evidence-real/manifest.txt
          printf 'generated_evidence=none\n' >> evidence-real/manifest.txt
          printf 'cross_group_replay=PASS\n' >> evidence-real/manifest.txt

      - name: Upload reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-flags-replay-reproduction
          path: |
            security/vercel-flags-precompute-replay/e2e/evidence-real/**
          if-no-files-found: error
          retention-days: 7
