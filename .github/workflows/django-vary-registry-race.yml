name: Django Vary registry race

on:
  push:
    branches:
      - h1-django-vary-registry-race
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django:
          - "Django==5.2.17"
          - "Django==6.0.8"
          - "Django==6.1.1"
          - "git+https://github.com/django/django.git@main"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Django target
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.django }}"

      - name: Reproduce Vary registry/page race
        run: python django-vary-registry-race.py
