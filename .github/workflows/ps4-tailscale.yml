name: PS4 Tailscale experimental port
on:
  push:
    branches: ['temp/ps4-tailscale']
    paths: ['ps4-tailscale/**', '.github/workflows/ps4-tailscale.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ps4-tailscale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ps4-tailscale/go.mod
          cache-dependency-path: ps4-tailscale/go.sum
      - run: go test -race ./...
      - run: go run ./runtime-probe
      - run: go build -trimpath -o ps4-relay-linux .
      - name: Build stock FreeBSD intermediate (NOT PS4-loadable)
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ps4-relay-freebsd-NOT-A-PAYLOAD .
      - uses: actions/upload-artifact@v4
        with:
          name: relay-development-binaries
          path: |
            ps4-tailscale/ps4-relay-linux
            ps4-tailscale/ps4-relay-freebsd-NOT-A-PAYLOAD
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host socket smoke test
        run: |
          cc -Wall -Wextra -Werror ps4-tailscale/probe/main.c -o /tmp/ps4-probe
          /tmp/ps4-probe
          cc -Wall -Wextra -Werror -pthread ps4-tailscale/probe/abi.c -o /tmp/ps4-abi
          /tmp/ps4-abi
      - name: Install pinned PS4 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 unzip
          curl -fL --retry 3 https://github.com/ps4-payload-dev/sdk/releases/download/v0.9/ps4-payload-sdk.zip -o /tmp/sdk.zip
          sudo unzip -q /tmp/sdk.zip -d /opt
      - run: make -C ps4-tailscale/probe PS4_PAYLOAD_SDK=/opt/ps4-payload-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-network-probe-UNVALIDATED-14.02
          path: |
            ps4-tailscale/probe/ps4-network-probe.elf
            ps4-tailscale/probe/ps4-abi-probe.elf

  runtime-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ps4-tailscale/go.mod
          cache-dependency-path: ps4-tailscale/go.sum
      - uses: actions/checkout@v4
        with:
          repository: holdmysocks/ps5-tailscale
          ref: be639c6ccde8f456d76dd7eb9978f48837b0a1b8
          path: upstream-ps5
          persist-credentials: false
      - name: Compile patched FreeBSD runtime research candidate
        working-directory: ps4-tailscale
        run: bash tools/build-runtime-candidate.sh "$GITHUB_WORKSPACE/upstream-ps5" "$RUNNER_TEMP/runtime-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: patched-runtime-research-NOT-PS4-LOADABLE
          path: ${{ runner.temp }}/runtime-candidate/

  windows-host:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ps4-tailscale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ps4-tailscale/go.mod
          cache-dependency-path: ps4-tailscale/go.sum
      - run: go test ./...
      - run: go run ./runtime-probe
      - run: go build -trimpath -o ps4-relay-windows.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-relay-development
          path: ps4-tailscale/ps4-relay-windows.exe

  homebrew:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenOrbis prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 python3-pil python3-qrcode
          curl -fL --retry 3 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o /tmp/oo.tar.gz
          mkdir -p "$RUNNER_TEMP/oo"
          tar -xzf /tmp/oo.tar.gz -C "$RUNNER_TEMP/oo"
          sdk=$(find "$RUNNER_TEMP/oo" -name link.x -print -quit)
          test -n "$sdk"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk")" >> "$GITHUB_ENV"
      - name: Validate console status parser
        run: |
          cc -Wall -Wextra -Werror ps4-tailscale/homebrew/screen.c ps4-tailscale/homebrew/screen_test.c -o /tmp/screen-test
          /tmp/screen-test
      - name: Build normal PS4 homebrew and emulator fixture
        run: make -C ps4-tailscale/homebrew
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-homebrew-frontend-UNVALIDATED
          path: ps4-tailscale/homebrew/out/
  emulator-smoke:
    needs: homebrew
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ps4-homebrew-frontend-UNVALIDATED
          path: homebrew-build
      - name: Install emulator runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool imagemagick mesa-vulkan-drivers vulkan-tools libvulkan1 libfuse2t64 unzip libxkbcommon0 libwayland-client0 libpulse0
          curl -fL --retry 3 https://github.com/shadps4-emu/shadPS4/releases/download/v.0.21.0/shadps4-linux-sdl-0.21.0.zip -o /tmp/shad.zip
          unzip -q /tmp/shad.zip -d "$RUNNER_TEMP/shad"
          exe=$(find "$RUNNER_TEMP/shad" -type f \( -iname shadps4 -o -iname '*.AppImage' \) -print -quit)
          test -n "$exe"
          chmod +x "$exe"
          echo "SHAD_EXE=$exe" >> "$GITHUB_ENV"
      - name: Launch shadPS4 and capture verified fixture frame
        env:
          APPIMAGE_EXTRACT_AND_RUN: '0'
        run: |
          mkdir -p emulator-evidence
          bash ps4-tailscale/homebrew/emulator-smoke.sh "$SHAD_EXE" homebrew-build/fixture/eboot.bin emulator-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadps4-emulator-evidence
          path: emulator-evidence/

  runtime-integration:
    needs: [runtime-research, full-daemon-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patched-runtime-research-NOT-PS4-LOADABLE
          path: runtime-images
      - name: Validate both actual Go PIE images with userspace loader
        run: |
          cc -Wall -Wextra -Werror -O2 ps4-tailscale/homebrew/runtime_loader.c ps4-tailscale/homebrew/runtime_map_test.c -o /tmp/runtime-map-test
          /tmp/runtime-map-test runtime-images/runtime-probe-NOT-PS4-LOADABLE.elf
          /tmp/runtime-map-test runtime-images/relay-NOT-PS4-LOADABLE.elf
      - name: Install OpenOrbis
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 python3-pil python3-qrcode
          curl -fL --retry 3 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o /tmp/oo.tar.gz
          mkdir -p "$RUNNER_TEMP/oo"
          tar -xzf /tmp/oo.tar.gz -C "$RUNNER_TEMP/oo"
          sdk=$(find "$RUNNER_TEMP/oo" -name link.x -print -quit)
          test -n "$sdk"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk")" >> "$GITHUB_ENV"
      - name: Link runtime into native console launchers
        run: make -C ps4-tailscale/homebrew -f Makefile.runtime RUNTIME_DIR="$GITHUB_WORKSPACE/runtime-images"
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-runtime-launchers-UNVALIDATED-DO-NOT-INSTALL
          path: ps4-tailscale/homebrew/runtime-out/*/eboot.bin
          if-no-files-found: error
  runtime-map-emulator:
    needs: runtime-integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ps4-runtime-launchers-UNVALIDATED-DO-NOT-INSTALL
          path: runtime-launchers
      - name: Install pinned emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool imagemagick mesa-vulkan-drivers vulkan-tools libvulkan1 libfuse2t64 unzip libxkbcommon0 libwayland-client0 libpulse0
          curl -fL --retry 3 https://github.com/shadps4-emu/shadPS4/releases/download/v.0.21.0/shadps4-linux-sdl-0.21.0.zip -o /tmp/shad.zip
          unzip -q /tmp/shad.zip -d "$RUNNER_TEMP/shad"
          exe=$(find "$RUNNER_TEMP/shad" -type f \( -iname shadps4 -o -iname '*.AppImage' \) -print -quit)
          test -n "$exe"
          chmod +x "$exe"
          echo "SHAD_EXE=$exe" >> "$GITHUB_ENV"
      - name: Map and relocate real embedded runtime in shadPS4, without executing FreeBSD syscalls
        run: |
          mkdir -p runtime-map-evidence
          bash ps4-tailscale/homebrew/emulator-smoke.sh "$SHAD_EXE" runtime-launchers/map-only/eboot.bin runtime-map-evidence
          grep -r 'PS4TS_RUNTIME_MAP_OK' runtime-map-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps4-runtime-map-evidence
          path: runtime-map-evidence/

  package-runtime:
    needs: [runtime-integration, runtime-map-emulator, background-payload, homebrew]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ps4-homebrew-frontend-UNVALIDATED
          path: homebrew-build
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-background-UNVALIDATED-14.02
          path: background-build
      - uses: actions/download-artifact@v4
        with:
          name: patched-runtime-research-NOT-PS4-LOADABLE
          path: runtime-images
      - uses: actions/checkout@v4
        with:
          repository: maxton/LibOrbisPkg
          ref: 72370ca3739e0708250695046b3886e50452dee7
          path: pkgtool-source
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build pinned open-source package tool against supported .NET
        run: |
          sed -i 's/netcoreapp3.0/net8.0/g' pkgtool-source/PkgTool.Core/PkgTool.Core.csproj pkgtool-source/LibOrbisPkg.Core/LibOrbisPkg.Core.csproj
          dotnet publish pkgtool-source/PkgTool.Core/PkgTool.Core.csproj -c Release -o "$RUNNER_TEMP/pkgtool"
      - name: Build and round-trip verify embedded daemon PKG
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          curl -fL --retry 3 https://raw.githubusercontent.com/tailscale/tailscale-android/b12728a809e132ce1ad0ba93ae2bed131907663a/android/src/main/ic_launcher-playstore.png -o ps4-tailscale/homebrew/tailscale-official.png
          test "$(git hash-object ps4-tailscale/homebrew/tailscale-official.png)" = 329755224bae83cbd3a1c1cc50c39fd036d58adc
          bash ps4-tailscale/homebrew/package.sh "$RUNNER_TEMP/pkgtool/PkgTool.Core.dll" homebrew-build/live/eboot.bin runtime-package native background-build/TailScale.elf runtime-images/relay-NOT-PS4-LOADABLE.elf
      - uses: actions/upload-artifact@v4
        with:
          name: TailScale-EXPERIMENTAL-native-pkg
          path: runtime-package/
          if-no-files-found: error


  full-daemon-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ps4-tailscale/go.mod
          cache-dependency-path: ps4-tailscale/go.sum
      - uses: actions/checkout@v4
        with:
          repository: holdmysocks/ps5-tailscale
          ref: be639c6ccde8f456d76dd7eb9978f48837b0a1b8
          path: upstream-ps5
          persist-credentials: false
      - name: Test original portable upstream feature suite
        working-directory: upstream-ps5/tsd
        run: go test ./...
      - name: Prepare complete adapted PS4 daemon
        run: python3 ps4-tailscale/tools/prepare-full-daemon.py upstream-ps5 "$RUNNER_TEMP/full-daemon"
      - name: Test PS4 compatibility adapters and compile full daemon
        run: |
          cd "$RUNNER_TEMP/full-daemon"
          PS4TS_DATA="$RUNNER_TEMP/tailnet-test-data" go test -race ./...
          go build -trimpath -o "$RUNNER_TEMP/full-daemon-host" .
      - uses: actions/upload-artifact@v4
        with:
          name: full-daemon-adapted-source
          path: ${{ runner.temp }}/full-daemon/

  background-payload:
    needs: runtime-research
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patched-runtime-research-NOT-PS4-LOADABLE
          path: runtime-images
      - name: Install pinned PS4 payload SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 unzip
          curl -fL --retry 3 https://github.com/ps4-payload-dev/sdk/releases/download/v0.9/ps4-payload-sdk.zip -o /tmp/sdk.zip
          sudo unzip -q /tmp/sdk.zip -d /opt
      - name: Build freestanding user-mode ELF and map-only probe
        run: |
          make -C ps4-tailscale/background RUNTIME_DIR="$GITHUB_WORKSPACE/runtime-images"
          python3 ps4-tailscale/background/verify-launcher.py ps4-tailscale/background/TailScale.elf ps4-tailscale/background/TailScale-map-probe.elf
      - name: Test safe GoldHEN configuration editing on host
        run: |
          cc -O2 -DTS_DATA_ROOT='"/tmp/ps4ts-test"' ps4-tailscale/homebrew/goldhen_setup.c ps4-tailscale/homebrew/goldhen_test.c -o /tmp/ps4ts-goldhen-test
          /tmp/ps4ts-goldhen-test
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-background-UNVALIDATED-14.02
          path: |
            ps4-tailscale/background/TailScale.elf
            ps4-tailscale/background/TailScale-map-probe.elf
          if-no-files-found: error
