name: PlayStation Session Share launcher function trace

on:
  push:
    branches:
      - h1-playstation-session-share

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract exact launcher functions
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 HackerOne-security-research'
          BASE='https://session-share.playstation.com/_next/static/chunks/pages'
          curl -sS -L --max-time 20 -A "$UA" "$BASE/launcher/%5BsessionId%5D/device-selector-1c3b279c0e4e590c.js" -o selector.js
          curl -sS -L --max-time 20 -A "$UA" "$BASE/launcher/%5BsessionId%5D/%5BplatformId%5D-085f920ed8cb5d35.js" -o launcher.js
          curl -sS -L --max-time 20 -A "$UA" "$BASE/preview/%5BcpssId%5D-985ffaf7f70352c1.js" -o preview.js

          python3 - <<'PY'
          import re
          files=['selector.js','launcher.js','preview.js']
          needles=[
            'async function getLinkedDevices',
            'function getLinkedDevices',
            'async function launchGameTitle',
            'function launchGameTitle',
            '/postcommand',
            'postcommand',
            'getclients',
            'clients?',
            'sessionUrl',
            'accessToken',
            'Authorization',
            'Bearer ',
            'getServerSideProps',
            '__N_SSP',
            'cpssId',
            'platformId',
            'launchUrl',
            'router.push',
            'window.location',
          ]
          for fn in files:
              t=open(fn,encoding='utf-8',errors='replace').read()
              print('\n===== '+fn+' SIZE '+str(len(t))+' =====')
              shown=[]
              for needle in needles:
                  pos=0
                  while True:
                      i=t.lower().find(needle.lower(),pos)
                      if i<0: break
                      lo=max(0,i-2600); hi=min(len(t),i+8500)
                      key=(lo//1200,hi//1200)
                      if key not in shown:
                          shown.append(key)
                          print('\n###',needle,'@',i)
                          print(t[lo:hi].replace('\n',' ')[:11500])
                      pos=i+len(needle)
          PY
