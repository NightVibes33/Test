name: PlayStation Session Share request tracing

on:
  push:
    branches:
      - h1-playstation-session-share

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trace CPSS/session client requests
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 HackerOne-security-research'
          BASE='https://session-share.playstation.com'
          PAGE="$BASE/5kBbS_pU_"
          curl -sS -L --max-time 20 -A "$UA" "$PAGE" -o page.html

          python3 - <<'PY'
          import re,html
          from urllib.parse import urljoin,urlparse
          h=open('page.html',encoding='utf-8',errors='replace').read()
          urls=[]
          for pat in [r'<script[^>]+src=["\x27]([^"\x27]+)',r'<link[^>]+href=["\x27]([^"\x27]+)']:
              for m in re.finditer(pat,h,re.I):
                  u=urljoin('https://session-share.playstation.com/',html.unescape(m.group(1)))
                  if urlparse(u).path.endswith('.js') and u not in urls: urls.append(u)
          open('urls.txt','w').write('\n'.join(urls))
          print('CHUNKS')
          for i,u in enumerate(urls,1): print(i,u)
          PY

          mkdir -p js
          i=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1))
            curl -sS -L --max-time 20 -A "$UA" "$u" -o "js/$i.js"
          done < urls.txt

          python3 - <<'PY'
          import glob,re
          terms=['cpssRequest','cpssUrl','sessionUrl','sessionInfo','userAccessToken','Authorization','Bearer','accessToken','launchUrl','playstationsession','jws','api/session/v1','api/cpss/v1']
          for f in sorted(glob.glob('js/*.js')):
              t=open(f,encoding='utf-8',errors='replace').read()
              hits=[]
              for term in terms:
                  pos=0
                  while True:
                      i=t.lower().find(term.lower(),pos)
                      if i<0: break
                      hits.append((i,term))
                      pos=i+len(term)
              if not hits: continue
              print('\n===== FILE',f,'SIZE',len(t),'=====')
              seen=[]
              for i,term in sorted(hits)[:100]:
                  lo=max(0,i-1800); hi=min(len(t),i+4200)
                  key=(lo//500,hi//500)
                  if key in seen: continue
                  seen.append(key)
                  print('\n---',term,'OFFSET',i,'---')
                  print(t[lo:hi].replace('\n',' ')[:6500])

          print('\n===== LIKELY ENDPOINT STRING LITERALS =====')
          seen=set()
          for f in glob.glob('js/*.js'):
              t=open(f,encoding='utf-8',errors='replace').read()
              for s in re.findall(r'["\x27]([^"\x27]{2,800})["\x27]',t):
                  if re.search(r'(?i)(cpss|sessionInfo|session/v1|accessToken|authorization|bearer|launchUrl|playstationsession|jws)',s):
                      if s not in seen:
                          seen.add(s); print(repr(s)[:1800])
          PY
