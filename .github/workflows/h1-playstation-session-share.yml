name: PlayStation Tournaments runtime config audit

on:
  push:
    branches:
      - h1-playstation-session-share

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract tournament runtime config
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 HackerOne-security-research'
          curl -sS -L --max-time 20 --connect-timeout 10 -A "$UA" \
            'https://compete.playstation.com/' -o page.html

          python3 - <<'PY'
          import re, json, html
          from urllib.parse import urljoin

          s=open('page.html',encoding='utf-8',errors='replace').read()

          print('=== APPLICATION/JSON BLOCKS ===')
          idx=0
          for m in re.finditer(r'<script([^>]*)type=["\x27]application/json["\x27]([^>]*)>(.*?)</script>',s,re.S|re.I):
              idx += 1
              raw=html.unescape(m.group(3)).strip()
              try:
                  obj=json.loads(raw)
              except Exception:
                  continue
              def has_runtime(x):
                  return isinstance(x,dict) and (
                      'service' in x or
                      ('gitSha' in x and 'version' in x) or
                      ('psnAppVersion' in x and 'staticAsset' in x)
                  )
              print(f'BLOCK {idx} TYPE={type(obj).__name__}')
              if isinstance(obj,dict):
                  print('KEYS',sorted(obj.keys()))
                  if has_runtime(obj):
                      print('RUNTIME_JSON',json.dumps(obj,indent=2,sort_keys=True)[:30000])
              elif isinstance(obj,list):
                  print('LIST_LEN',len(obj))
                  for j,item in enumerate(obj[:100]):
                      if has_runtime(item):
                          print('RUNTIME_ITEM',j,json.dumps(item,indent=2,sort_keys=True)[:30000])

          print('\n=== INLINE JSON-LIKE RUNTIME OBJECTS ===')
          # Also inspect JSON-looking script blocks without type=application/json.
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              raw=html.unescape(m.group(2)).strip()
              if not raw or ('"service"' not in raw and '"gitSha"' not in raw and '"psnAppVersion"' not in raw):
                  continue
              print('SCRIPT_ATTRS',m.group(1)[:400])
              print('SCRIPT_PREFIX',raw[:12000])

          print('\n=== TOURNAMENT HTML SIGNALS ===')
          patterns=[
            r'<[^>]*(?:tournament|competition|bracket|match|register|check.?in|team)[^>]*>',
            r'(?:data-[\w-]+|href|src)=["\x27][^"\x27]*(?:tournament|competition|bracket|match|register|check.?in|team)[^"\x27]*["\x27]'
          ]
          seen=set()
          for pat in patterns:
              for x in re.findall(pat,s,re.I):
                  x=' '.join(x.split())
                  if x not in seen:
                      seen.add(x)
                      print(x[:2000])

          print('\n=== URL-LIKE STRINGS NEAR CONFIG ===')
          for u in sorted(set(re.findall(r'https?://[^"\x27<>\\\s]+',s))):
              if re.search(r'(?i)(playstation|sony|tournament|competition|match|api|graphql)',u):
                  print(u[:1500])
          PY
