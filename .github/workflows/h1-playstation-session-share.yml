name: PlayStation WCA mutation extraction

on:
  push:
    branches:
      - h1-playstation-session-share

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract current mutation documents
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 HackerOne-security-research'
          URL='https://static.playstation.com/wca/v2/js/common.1c5ea9cc607e3157534a.js'
          curl -sS -L --max-time 30 --connect-timeout 10 -A "$UA" "$URL" -o common.js
          echo "SIZE=$(wc -c < common.js)"

          python3 - <<'PY'
          import re
          t=open('common.js',encoding='utf-8',errors='replace').read()
          needles=[
            'backgroundPurchase',
            'wcaAddItemToStoreWishlist',
            'wcaRemoveItemFromStoreWishlist',
            'storeWishlistAddItem',
            'storeWishlistRemoveItem',
            'BackgroundPurchase',
            'purchase'
          ]
          seen=[]
          for needle in needles:
              pos=0
              while True:
                  i=t.find(needle,pos)
                  if i<0: break
                  lo=max(0,i-5000); hi=min(len(t),i+9000)
                  key=(lo//2500,hi//2500)
                  if key not in seen:
                      seen.append(key)
                      print('\n===== '+needle+' @ '+str(i)+' =====')
                      print(t[lo:hi].replace('\n',' ')[:14000])
                  pos=i+len(needle)

          print('\n=== EMBEDDED GRAPHQL DOCS ===')
          # Decode escaped/minified string windows around mutation names.
          for name in ['backgroundPurchase','wcaAddItemToStoreWishlist','wcaRemoveItemFromStoreWishlist']:
              i=t.find(name)
              if i<0:
                  print(name,'NOT_FOUND')
                  continue
              win=t[max(0,i-8000):min(len(t),i+16000)]
              # print GraphQL-like mutation snippets in the window
              for m in re.finditer(r'mutation\s+[A-Za-z0-9_]+[^}]{0,12000}\}',win,re.S):
                  print(name,'DOC',m.group(0)[:12000].replace('\\n','\n'))
              # Inputs / variable construction near call site
              print(name,'IDENTIFIERS',sorted(set(re.findall(r'[A-Za-z_][A-Za-z0-9_]{2,80}',win)))[:500])

          print('\n=== 64-CHAR HASHES NEAR MUTATIONS ===')
          for name in ['backgroundPurchase','wcaAddItemToStoreWishlist','wcaRemoveItemFromStoreWishlist']:
              pos=0
              while True:
                  i=t.find(name,pos)
                  if i<0: break
                  win=t[max(0,i-5000):min(len(t),i+8000)]
                  hs=sorted(set(re.findall(r'\b[0-9a-fA-F]{64}\b',win)))
                  if hs: print(name,hs)
                  pos=i+len(name)
          PY
