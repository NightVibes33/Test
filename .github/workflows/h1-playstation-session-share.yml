name: PlayStation Session Share static audit

on:
  push:
    branches:
      - h1-playstation-session-share

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Session Share app
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 HackerOne-security-research'
          BASE='https://session-share.playstation.com'
          SID='5kBbS_pU_'
          PAGE="$BASE/$SID"

          curl -sS -L --max-time 20 --connect-timeout 10 -A "$UA" "$PAGE" -o page.html

          echo '=== NEXT_DATA SUMMARY ==='
          python3 - <<'PY'
          import re,json,hashlib,base64
          html=open('page.html','r',encoding='utf-8',errors='replace').read()
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',html,re.S)
          if not m:
              print('NO_NEXT_DATA')
              raise SystemExit
          d=json.loads(m.group(1))
          print('TOP_KEYS',sorted(d.keys()))
          print('BUILD_ID',d.get('buildId'))
          pp=((d.get('props') or {}).get('pageProps') or {})
          print('PAGEPROP_KEYS',sorted(pp.keys()))
          for k,v in pp.items():
              lk=k.lower()
              if 'token' in lk or 'auth' in lk or 'session' in lk or 'launch' in lk or 'url' in lk or 'platform' in lk:
                  if isinstance(v,str):
                      print('PROP',k,'TYPE=str','LEN='+str(len(v)),'SHA256='+hashlib.sha256(v.encode()).hexdigest()[:16])
                      if v.count('.')==2:
                          try:
                              h,p,s=v.split('.')
                              dec=lambda x: json.loads(base64.urlsafe_b64decode(x+'='*((4-len(x)%4)%4)))
                              print('JWT_HEADER',dec(h))
                              payload=dec(p)
                              safe={x:payload.get(x) for x in ['iss','aud','azp','client_id','scope','scp','exp','iat','sub','token_use'] if x in payload}
                              print('JWT_CLAIMS',safe)
                          except Exception as e:
                              print('JWT_DECODE_ERR',type(e).__name__)
                  else:
                      print('PROP',k,'TYPE='+type(v).__name__,'VALUE',json.dumps(v)[:1800])
          open('nextdata.json','w').write(json.dumps(d))
          PY

          echo '=== SESSION CHUNK STATIC STRINGS ==='
          CHUNK="$BASE/_next/static/chunks/pages/%5BsessionId%5D-85e43b90b5e068ae.js"
          curl -sS -L --max-time 20 --connect-timeout 10 -A "$UA" "$CHUNK" -o session.js
          python3 - <<'PY'
          import re
          text=open('session.js','r',encoding='utf-8',errors='replace').read()
          pats=[
            r'https?://[^"\x27\\\s<>]+',
            r'["\x27]([^"\x27]{1,500}(?:/api/|graphql|sessionId|userAccessToken|launchUrl|jws|oembed|sessionShare|sessionshare)[^"\x27]{0,500})["\x27]',
          ]
          seen=set()
          for p in pats:
              for m in re.finditer(p,text,re.I):
                  s=m.group(1) if m.lastindex else m.group(0)
                  if len(s)>1200: s=s[:1200]
                  if s not in seen:
                      seen.add(s); print(s)
          PY

          echo '=== SOURCE MAP CHECKS ==='
          for u in \
            "$BASE/_next/static/chunks/pages/%5BsessionId%5D-85e43b90b5e068ae.js.map" \
            "$BASE/_next/static/chunks/pages/_app-92476ed5e1fe4725.js.map"; do
            curl -sS -L --max-time 20 --connect-timeout 10 -A "$UA" -o /tmp/sm -w 'MAP %{http_code} %{content_type} %{size_download} %{url_effective}\n' "$u" || true
            head -c 80 /tmp/sm | python3 -c 'import sys; print(repr(sys.stdin.buffer.read()))'
          done

          echo '=== API/GRAPHQL LITERALS FROM ALL PAGE CHUNKS ==='
          python3 - <<'PY'
          import re,html
          from urllib.parse import urljoin,urlparse
          h=open('page.html','r',encoding='utf-8',errors='replace').read()
          urls=[]
          for pat in [r'<script[^>]+src=["\x27]([^"\x27]+)',r'<link[^>]+href=["\x27]([^"\x27]+)']:
              for m in re.finditer(pat,h,re.I):
                  u=urljoin('https://session-share.playstation.com/',html.unescape(m.group(1)))
                  if urlparse(u).path.endswith('.js') and u not in urls: urls.append(u)
          open('js_urls.txt','w').write('\n'.join(urls))
          print('JS_COUNT',len(urls))
          PY
          mkdir -p js
          i=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1)); curl -sS -L --max-time 20 --connect-timeout 10 -A "$UA" "$u" -o "js/$i.js" || true
          done < js_urls.txt
          python3 - <<'PY'
          import glob,re
          seen=set()
          for f in glob.glob('js/*.js'):
              t=open(f,'r',encoding='utf-8',errors='replace').read()
              for m in re.finditer(r'(?i).{0,180}(?:https?://[^"\x27\\\s<>]+|/api/[^"\x27\\\s<>]+|graphql|userAccessToken|launchUrl|playstationsession|oembed).{0,260}',t):
                  s=m.group(0).replace('\n',' ')
                  if s not in seen:
                      seen.add(s); print(s[:1000])
          PY
