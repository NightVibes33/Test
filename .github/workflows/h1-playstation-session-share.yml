name: PlayStation Android 26.8.x static audit

on:
  push:
    branches:
      - h1-playstation-session-share

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download and inspect latest PlayStation App APK
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 HackerOne-security-research'
          APK=psapp.apk

          curl -sS -L --max-time 90 --connect-timeout 15 -A "$UA" \
            'https://d.apkpure.net/b/APK/com.scee.psxandroid?version=latest' \
            -o "$APK" \
            -w 'HTTP=%{http_code}\nTYPE=%{content_type}\nSIZE=%{size_download}\nFINAL=%{url_effective}\n'

          echo '=== FILE ==='
          file "$APK"
          stat -c 'BYTES=%s' "$APK"
          sha256sum "$APK"

          echo '=== APK TOOLING ==='
          echo "AAPT=$(command -v aapt || true)"
          echo "AAPT2=$(command -v aapt2 || true)"
          echo "APK_ANALYZER=$(command -v apkanalyzer || true)"

          echo '=== BADGING ==='
          if command -v aapt >/dev/null; then
            aapt dump badging "$APK" | sed -n '1,80p'
          elif command -v aapt2 >/dev/null; then
            aapt2 dump badging "$APK" | sed -n '1,80p' || true
          fi

          echo '=== MANIFEST (FOCUSED) ==='
          if command -v apkanalyzer >/dev/null; then
            apkanalyzer manifest print "$APK" > manifest.xml
            python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('manifest.xml').getroot()
          A='{http://schemas.android.com/apk/res/android}'
          print('PACKAGE',root.attrib.get('package'))
          print('VERSION_CODE',root.attrib.get(A+'versionCode'))
          print('VERSION_NAME',root.attrib.get(A+'versionName'))
          app=root.find('application')
          print('APP_DEBUGGABLE',app.attrib.get(A+'debuggable'))
          print('USES_CLEARTEXT',app.attrib.get(A+'usesCleartextTraffic'))
          print('NETWORK_SECURITY_CONFIG',app.attrib.get(A+'networkSecurityConfig'))
          for tag in ['activity','activity-alias','service','receiver','provider']:
              for e in app.findall(tag):
                  exported=e.attrib.get(A+'exported')
                  filters=e.findall('intent-filter')
                  if exported=='true' or filters:
                      print('\nCOMPONENT',tag,e.attrib.get(A+'name'),'exported='+str(exported),
                            'permission='+str(e.attrib.get(A+'permission')))
                      for flt in filters:
                          print(' ACTIONS',[x.attrib.get(A+'name') for x in flt.findall('action')])
                          print(' CATEGORIES',[x.attrib.get(A+'name') for x in flt.findall('category')])
                          for d in flt.findall('data'):
                              print(' DATA',{k.split('}')[-1]:v for k,v in d.attrib.items()})
          PY
          else
            echo 'apkanalyzer unavailable'
          fi

          echo '=== ZIP SECURITY CONFIG FILES ==='
          unzip -l "$APK" | grep -Ei 'network.security|security_config|file_paths|paths.xml|assetlinks|deeplink|intent' | head -120 || true

          echo '=== DEX SECURITY-RELEVANT STRINGS ==='
          rm -rf unpack && mkdir unpack
          unzip -qq "$APK" 'classes*.dex' -d unpack
          for f in unpack/classes*.dex; do strings -a "$f"; done | \
            grep -Eia 'session-share|sessionshare|profile\.playstation|compete\.playstation|web\.np\.playstation|api\.playstation|sonyentertainmentnetwork|oauth|redirect_uri|deeplink|deep.link|intent://|playstationsession|postMessage|javascript:|addJavascriptInterface|setJavaScriptEnabled|setAllowFileAccess|setAllowUniversalAccessFromFileURLs|WebView|content://|file://' | \
            sort -u | head -1200
