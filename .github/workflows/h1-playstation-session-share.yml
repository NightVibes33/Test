name: PlayStation Session Share focused bundle probe

on:
  push:
    branches:
      - h1-playstation-session-share

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current Session Share launcher bundle
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 HackerOne-security-research'
          BASE='https://session-share.playstation.com'
          SESSION_CHUNK="$BASE/_next/static/chunks/pages/%5BsessionId%5D-85e43b90b5e068ae.js"

          curl -sS -L --max-time 20 --connect-timeout 10 -A "$UA" "$SESSION_CHUNK" -o session.js \
            -w 'SESSION_CHUNK_HTTP=%{http_code}\nSESSION_CHUNK_TYPE=%{content_type}\nSESSION_CHUNK_SIZE=%{size_download}\n'

          python3 - <<'PY'
          import re
          text=open('session.js','r',encoding='utf-8',errors='replace').read()

          print('=== INTERESTING URLS ===')
          urls=[]
          for u in re.findall(r'https?://[^"\x27\\\s<>]+', text):
              if re.search(r'playstation|sony|steam|session|api|graphql',u,re.I) and u not in urls:
                  urls.append(u)
          for u in urls:
              print(u[:1200])

          print('=== FOCUSED CONTEXTS ===')
          terms=[
              'steampowered.com','playstationsession','jws','launchUrl','launcher',
              'JoinCTA','/share/','sessionId','window.location','location.assign',
              'location.href','window.open','jwt','decode','GraphQL','mutation ',
              'query ','/api/','getServerSideProps','userAccessToken','platforms'
          ]
          seen=set()
          for term in terms:
              start=0
              count=0
              while True:
                  i=text.lower().find(term.lower(),start)
                  if i<0 or count>=20:
                      break
                  lo=max(0,i-500); hi=min(len(text),i+1200)
                  sn=text[lo:hi].replace('\n',' ')
                  key=sn[:900]
                  if key not in seen:
                      seen.add(key)
                      print('\n--- TERM:',term,'OFFSET',i,'---')
                      print(sn)
                  start=i+max(1,len(term)); count+=1

          print('=== STRING LITERALS WITH ROUTES/APIS ===')
          lits=re.findall(r'["\x27]([^"\x27]{3,500})["\x27]',text)
          out=[]
          for s in lits:
              if re.search(r'(session|share|launch|jws|steam|/api/|graphql|playstation)',s,re.I):
                  if s not in out:
                      out.append(s)
          for s in out[:400]:
              print(repr(s))
          PY

          echo '=== CURRENT PAGE SSR METADATA ==='
          curl -sS -L --max-time 20 --connect-timeout 10 -A "$UA" \
            'https://session-share.playstation.com/5kBbS_pU_' -o page.html
          python3 - <<'PY'
          import re, html, json
          t=open('page.html','r',encoding='utf-8',errors='replace').read()
          for key in ['__NEXT_DATA__','launchUrl','jws','sessionId','platforms','playstationsession']:
              print('COUNT',key,t.lower().count(key.lower()))
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',t,re.S)
          if m:
              raw=html.unescape(m.group(1))
              print('NEXT_DATA_PREFIX',raw[:5000])
              try:
                  o=json.loads(raw)
                  print('NEXT_DATA_TOP_KEYS',list(o.keys()))
                  print('NEXT_DATA_PAGE',o.get('page'))
                  print('NEXT_DATA_BUILD',o.get('buildId'))
                  print('NEXT_DATA_PROPS',json.dumps(o.get('props'),separators=(',',':'))[:15000])
              except Exception as e:
                  print('NEXT_DATA_JSON_ERROR',repr(e))
          PY
