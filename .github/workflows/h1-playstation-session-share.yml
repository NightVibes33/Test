name: PlayStation Tournaments focused config extraction

on:
  push:
    branches:
      - h1-playstation-session-share

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract only service and tournament-specific config
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 HackerOne-security-research'
          curl -sS -L --max-time 20 --connect-timeout 10 -A "$UA" \
            'https://compete.playstation.com/' -o page.html

          python3 - <<'PY'
          import re,json,html
          s=open('page.html',encoding='utf-8',errors='replace').read()
          runtime=None
          for m in re.finditer(r'<script[^>]*type=["\x27]application/json["\x27][^>]*>(.*?)</script>',s,re.S|re.I):
              try: obj=json.loads(html.unescape(m.group(1)).strip())
              except: continue
              if isinstance(obj,dict) and 'service' in obj and 'gitSha' in obj:
                  runtime=obj; break
          if runtime:
              for k in ['name','env','isoenv','version','psnAppVersion','gitBranch','gitSha']:
                  print(k,'=',repr(runtime.get(k)))
              print('SERVICE=',json.dumps(runtime.get('service'),indent=2,sort_keys=True))
              print('FEATURE=',json.dumps(runtime.get('feature'),indent=2,sort_keys=True))
              sa=runtime.get('staticAsset')
              print('STATIC_ASSET=',json.dumps(sa,indent=2,sort_keys=True)[:5000])

          print('\n=== TOURNAMENT-RELATED TAGS / COMPONENT NAMES ===')
          vals=set()
          for m in re.finditer(r'<([\w:-]+)([^>]*)>',s,re.I):
              tag=m.group(1); attrs=m.group(2)
              blob=(tag+' '+attrs)
              if re.search(r'(?i)(tournament|competition|bracket|match|register|check.?in|leaderboard)',blob):
                  vals.add(' '.join(blob.split()))
          for v in sorted(vals): print(v[:3000])

          print('\n=== TOURNAMENT-RELATED JSON KEYS/VALUES ===')
          for m in re.finditer(r'<script[^>]*type=["\x27]application/json["\x27][^>]*>(.*?)</script>',s,re.S|re.I):
              raw=html.unescape(m.group(1)).strip()
              try: obj=json.loads(raw)
              except: continue
              def walk(x,path=''):
                  if isinstance(x,dict):
                      for k,v in x.items():
                          p=f'{path}.{k}' if path else k
                          if re.search(r'(?i)(tournament|competition|bracket|match|register|check.?in|leaderboard)',k):
                              print(p,'=',repr(v)[:4000])
                          walk(v,p)
                  elif isinstance(x,list):
                      for i,v in enumerate(x[:200]): walk(v,f'{path}[{i}]')
                  elif isinstance(x,str) and re.search(r'(?i)(tournament|competition|bracket|match|register|check.?in|leaderboard)',x):
                      print(path,'=',repr(x)[:4000])
              walk(obj)
          PY
