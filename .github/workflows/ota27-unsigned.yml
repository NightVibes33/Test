name: OTA27 unsigned IPA

on:
  push:
    paths:
      - "OTA27/**"
      - ".github/workflows/ota27-unsigned.yml"
  workflow_dispatch:

jobs:
  build:
    # GitHub's Xcode 27 image is macOS 27 on Apple Silicon (no Intel label).
    runs-on: xcode-27
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verify macOS 27 and Xcode 27 runner
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" = "27"
          test "$(uname -m)" = "arm64"
          test "$(xcodebuild -version | awk '/^Xcode / {print $2}' | cut -d. -f1)" = "27"

      - name: Validate OTA profile and NFCARD transport integration
        run: |
          python3 OTA27/tests/profile_validation.py
          plutil -lint OTA27/Resources/blockota.mobileconfig

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Cache exact NFCARD-patched AirLift XCFramework
        uses: actions/cache@v4
        with:
          path: OTA27/Dependencies/AirliftFFI.xcframework
          key: ota27-airlift-nfcard-097a058-16f8bfd-xcode27-arm64-v1

      - name: Cache Rust compilation artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ota27-rust-nfcard-097a058-16f8bfd-ios-v1

      - name: Build NFCARD-patched AirLift FFI from its exact pinned source and patch
        shell: bash
        run: |
          set -Eeuxo pipefail
          trap 'rc=$?; echo "::error file=.github/workflows/ota27-unsigned.yml::AirLift preparation failed at line ${LINENO} (${BASH_COMMAND}); exit ${rc}";' ERR
          echo "::group::AirLift NFCARD source preflight"
          command -v python3
          command -v cargo
          command -v rustup
          cargo --version
          rustc --version
          echo "::endgroup::"
          PIN=097a058c984ffc33ccb697b9dfe8058be3e86244
          NFCARD_COMMIT=16f8bfd20a88a474f59c2d6eda291164a1cc015f
          OUT=OTA27/Dependencies/AirliftFFI.xcframework
          if [ -s "$OUT/ios-arm64/libairlift_ffi.a" ] && grep -q al_connection_endpoint_set "$OUT/ios-arm64/Headers/airlift.h"; then
            echo "Exact NFCARD-patched AirLift found in cache"
            exit 0
          fi
          SRC="$RUNNER_TEMP/aircard-upstream"
          NFC="$RUNNER_TEMP/nfcard-revision"
          mkdir -p "$SRC" "$NFC"
          git -C "$SRC" init -q
          git -C "$SRC" remote add origin https://github.com/Mak5er/AirCard-iOS.git
          git -C "$SRC" fetch --depth 1 origin "$PIN"
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$PIN"
          git -C "$NFC" init -q
          git -C "$NFC" remote add origin https://github.com/NightVibes33/NFCARD.git
          git -C "$NFC" fetch --depth 1 origin "$NFCARD_COMMIT"
          git -C "$NFC" checkout --detach FETCH_HEAD
          test "$(git -C "$NFC" rev-parse HEAD)" = "$NFCARD_COMMIT"
          echo "::group::Copy pinned NFCARD integration files"
          for file in AirCardLibrary.swift RemotePairingPortDiscovery.swift NFCARDNativeShell.swift; do
            test -s "$NFC/Sources/$file"
            cp -v "$NFC/Sources/$file" "$SRC/ios-app/$file"
          done
          echo "::endgroup::"
          echo "::group::Patch pinned upstream AirLift source"
          test -s "$NFC/scripts/patch-upstream.py"
          PYTHONUNBUFFERED=1 python3 "$NFC/scripts/patch-upstream.py" "$SRC"
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          header = (root / "rust-core/include/airlift.h").read_text()
          exploit = (root / "rust-core/src/exploit.rs").read_text()
          lib = (root / "rust-core/src/lib.rs").read_text()
          for check, name in (
              ("al_connection_endpoint_set" in header, "FFI header"),
              ("using discovered Remote Pairing endpoint" in exploit, "Rust transport"),
              ("al_connection_endpoint_set" in lib, "Rust C-ABI export"),
          ):
              if not check:
                  raise SystemExit(f"::error::NFCARD patch missing {name}")
              print(f"Verified NFCARD patch: {name}", flush=True)
          PY
          echo "::endgroup::"
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "::group::Compile pinned AirLift for iOS device and simulator"
          (cd "$SRC" && bash -x ./build-ios.sh)
          echo "::endgroup::"
          test -s "$SRC/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a"
          rm -rf "$OUT"
          mkdir -p OTA27/Dependencies
          ditto "$SRC/AirliftFFI.xcframework" "$OUT"
          grep -q al_connection_endpoint_set "$OUT/ios-arm64/Headers/airlift.h"

      - name: Stage pinned Cinder27 executable test harness
        shell: bash
        run: |
          set -euo pipefail
          CINDER_COMMIT=7949c7ce9fab8139e961058d8ddd60b2bae47a09
          SRC="$RUNNER_TEMP/cinder27-pinned"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://git.jbjflab.top/admin/cinder27.git
          git -C "$SRC" fetch --depth 1 origin "$CINDER_COMMIT"
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$CINDER_COMMIT"
          # Byte-for-byte provenance checks against the uploaded cinder27 v2.0 archive.
          test "$(shasum -a 256 "$SRC/README.md" | awk '{print $1}')" = "3249076c7fbb820e7429cfd72470f5510b80d52a9006d621d3bc299df17317d3"
          test "$(shasum -a 256 "$SRC/Sources/Catalog.swift" | awk '{print $1}')" = "66d2dc58ac80e622e874135dc11358ee0fe35b998e998676d43d3599a7ba4657"
          test "$(shasum -a 256 "$SRC/Sources/Views.swift" | awk '{print $1}')" = "fe4c63dd8f60c272ceca821d86fd0196037c57751aae064c0786abda263d1284"
          test "$(shasum -a 256 "$SRC/CVE-2026-112522/CVE-2026-112522.c" | awk '{print $1}')" = "539e03eca09454bb132b45efd6a8f3796de671e50ef28f4d990daf394bdff1f1"
          mkdir -p OTA27/CinderLab
          cp -R "$SRC/Sources" OTA27/CinderLab/Sources
          python3 -c 'from pathlib import Path; p=Path("OTA27/CinderLab/Sources/Views.swift"); s=p.read_text(); assert s.count("@main\nstruct Cinder27App: App {")==1; p.write_text(s.replace("@main\nstruct Cinder27App: App {", "struct Cinder27App: App {", 1))'
          grep -q 'enum Catalog' OTA27/CinderLab/Sources/Catalog.swift
          grep -q 'struct LabView' OTA27/CinderLab/Sources/LabView.swift
          # Build the five original parser seeds; without them several modules silently
          # return 'seed missing' even though the lab UI is present.
          python3 "$SRC/scripts/gen_seeds.py"
          mkdir -p OTA27/CinderLab/Seeds
          for seed in joliet_path_oob.iso deep_nest.usda stack_bomb.cff ktx2_bad_dims.ktx2 bc7_short.dds; do
            test -s "$SRC/seeds/$seed"
            cp "$SRC/seeds/$seed" "OTA27/CinderLab/Seeds/$seed"
          done
          # Each of the 31 CVE families must include an executable Swift and C POC,
          # and RockRidge is the 32nd independent family.
          test "$(find "$SRC" -mindepth 2 -maxdepth 2 -name 'CVE-*.swift' | wc -l | tr -d ' ')" = 31
          test "$(find "$SRC" -mindepth 2 -maxdepth 2 -name 'CVE-*.c' | wc -l | tr -d ' ')" = 31
          test -f "$SRC/arc.rr/arc.rr.swift"
          test -f "$SRC/arc.rr/arc.rr.py"
          test -f OTA27/Sources/CinderLabHost.swift
          grep -q 'ModuleDetailView(module: module)' OTA27/Sources/Cinder27POCIndexView.swift
          # Include original standalone Swift/C/Python PoCs for inspectable export.
          test "$(find "$SRC" -mindepth 1 -maxdepth 1 -type d -name 'CVE-*' | wc -l | tr -d ' ')" = 31
          (cd "$SRC" && zip -q -r "$GITHUB_WORKSPACE/OTA27/CinderLab/CinderPOCs.zip" CVE-* arc.rr kern.baseline probe.privset sbx.toctou tool.backup tool.container tool.hex tool.macho tool.paths tool.zip)
          unzip -tq OTA27/CinderLab/CinderPOCs.zip
          test -s OTA27/CinderLab/CinderPOCs.zip

      - name: Generate Xcode project
        run: xcodegen generate --spec OTA27/project.yml --project OTA27

      - name: Compile without code signing
        run: |
          set -euo pipefail
          xcodebuild -project OTA27/OTA27Blocker.xcodeproj -scheme OTA27Blocker -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/OTA27Derived" CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build

      - name: Verify bundled Cinder27 PoC seeds
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/OTA27Derived/Build/Products/Release-iphoneos/OTA27Blocker.app"
          for seed in joliet_path_oob.iso deep_nest.usda stack_bomb.cff ktx2_bad_dims.ktx2 bc7_short.dds; do
            test -s "$APP/$seed"
          done

      - name: Verify exported Grappa callback
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/OTA27Derived/Build/Products/Release-iphoneos/OTA27Blocker.app/OTA27Blocker"
          test -f "$BIN"
          xcrun nm -gU "$BIN" | grep -q '_ALGetGrappaToken'

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/OTA27Derived/Build/Products/Release-iphoneos/OTA27Blocker.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/OTA27Payload/Payload"
          ditto "$APP" "$RUNNER_TEMP/OTA27Payload/Payload/OTA27Blocker.app"
          (cd "$RUNNER_TEMP/OTA27Payload" && ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/OTA27Blocker-unsigned.ipa")
          unzip -tq OTA27Blocker-unsigned.ipa
          unzip -l OTA27Blocker-unsigned.ipa | grep -E 'Payload/OTA27Blocker.app/(OTA27Blocker|blockota.mobileconfig)'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OTA27Blocker-unsigned-ipa
          path: OTA27Blocker-unsigned.ipa
          if-no-files-found: error
