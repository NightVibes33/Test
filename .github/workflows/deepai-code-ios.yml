name: DeepAI Code 0.3.40 embedded Node iOS
on:
  workflow_dispatch:
  push:
    branches: [deepai-ios-port]
    paths:
      - 'DeepAI-iOS-Port/**'
      - '.github/workflows/deepai-code-ios.yml'

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Download official DeepAI 0.3.40 DMG
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 'https://deepai.org/download/deepai-code/mac-apple-silicon' -o "$RUNNER_TEMP/deepai.dmg"
          echo "12fc7d32446abbb4e9571c6da977890b2da12d3bca3780053ef0584963ccb973  $RUNNER_TEMP/deepai.dmg" | shasum -a 256 -c -
      - name: Extract original frontend and original coding engine
        run: python3 DeepAI-iOS-Port/Scripts/extract_deepai_dmg.py "$RUNNER_TEMP/deepai.dmg" --with-server
      - name: Obtain and verify iOS Node.js 24 runtime
        run: bash DeepAI-iOS-Port/Scripts/get-node-mobile.sh
      - name: Check source and original runtime entry
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse DeepAI-iOS-Port/Sources/*.swift
          node --check DeepAI-iOS-Port/Compatibility/fff-ios.mjs
          node --check DeepAI-iOS-Port/Compatibility/node-pty/index.js
          test -s DeepAI-iOS-Port/OriginalServer/apps/server/dist/bin.mjs
          test -s DeepAI-iOS-Port/OriginalWebClient/index.html
      - name: Generate Xcode project
        shell: bash
        run: |
          cd DeepAI-iOS-Port
          xcodegen generate --spec project.yml
      - name: Compile simulator target
        shell: bash
        run: |
          cd DeepAI-iOS-Port
          xcodebuild -project DeepAICodeIOS.xcodeproj -scheme DeepAICodeIOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Simulator ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Simulator launch and backend diagnostics
        id: launch
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          SIM=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; x=json.load(sys.stdin)["devices"]; d=[v for vs in x.values() for v in vs if v["name"].startswith("iPhone") and v["state"]=="Shutdown"]; print(d[0]["udid"] if d else "")')
          mkdir -p DeepAI-iOS-Port/build/diagnostics
          echo "Simulator chosen: $SIM" > DeepAI-iOS-Port/build/diagnostics/stages.txt
          test -n "$SIM"
          echo "Booting simulator" >> DeepAI-iOS-Port/build/diagnostics/stages.txt
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
          echo "Simulator booted, installing app" >> DeepAI-iOS-Port/build/diagnostics/stages.txt
          xcrun simctl install "$SIM" DeepAI-iOS-Port/build/Simulator/Build/Products/Debug-iphonesimulator/DeepAICodeIOS.app
          echo "App installed, launching" >> DeepAI-iOS-Port/build/diagnostics/stages.txt
          python3 - "$SIM" <<'PY'
          import subprocess, sys
          sim=sys.argv[1]
          try:
              p=subprocess.run(["xcrun","simctl","launch",sim,"org.deepai.code.ios.embedded"],text=True,capture_output=True,timeout=60)
              result=f"simctl launch exit {p.returncode}\\n{p.stdout}\\n{p.stderr}"
          except subprocess.TimeoutExpired as e:
              result="simctl launch timed out after 60 seconds; collecting diagnostics regardless"
          print(result)
          with open("DeepAI-iOS-Port/build/diagnostics/launch-result.txt","w") as f:
              f.write(result)
          PY
          echo "App launch command returned" >> DeepAI-iOS-Port/build/diagnostics/stages.txt
          sleep 9
          xcrun simctl io "$SIM" screenshot DeepAI-iOS-Port/build/embedded-node-simulator.png
          echo "Screenshot captured" >> DeepAI-iOS-Port/build/diagnostics/stages.txt
          xcrun simctl get_app_container "$SIM" org.deepai.code.ios.embedded data > DeepAI-iOS-Port/build/diagnostics/container.txt
          DATA=$(cat DeepAI-iOS-Port/build/diagnostics/container.txt)
          echo "App data container found: $DATA" >> DeepAI-iOS-Port/build/diagnostics/stages.txt
          python3 - "$SIM" <<'PY'
          import subprocess,sys
          sim=sys.argv[1]
          command=["xcrun","simctl","spawn",sim,"log","show","--last","10s","--style","compact","--predicate",'process == "DeepAICodeIOS"']
          try:
              result=subprocess.run(command, capture_output=True, text=True, timeout=25)
              output=(result.stdout + "\n" + result.stderr)[-150000:]
          except subprocess.TimeoutExpired:
              output="Simulator system log query timed out (25 s)"
          with open("DeepAI-iOS-Port/build/diagnostics/simulator-system.log","w") as f:
              f.write(output)
          PY
          find "$HOME/Library/Logs/DiagnosticReports" -name '*DeepAICodeIOS*' -type f -mmin -12 -exec cp {} DeepAI-iOS-Port/build/diagnostics/ \; 2>/dev/null || true
          find "$DATA/Library/Logs/CrashReporter" -name '*DeepAICodeIOS*' -type f -exec cp {} DeepAI-iOS-Port/build/diagnostics/ \; 2>/dev/null || true
          test -f "$DATA/Library/Application Support/DeepAI/embedded-node.log" && cp "$DATA/Library/Application Support/DeepAI/embedded-node.log" DeepAI-iOS-Port/build/diagnostics/embedded-node.log || true
      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepAI-embedded-node-simulator-diagnostics
          path: |
            DeepAI-iOS-Port/build/embedded-node-simulator.png
            DeepAI-iOS-Port/build/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build unsigned real-device IPA
        run: bash DeepAI-iOS-Port/Scripts/build-ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeepAI-Code-0.3.40-Embedded-Node-iOS-unsigned
          path: DeepAI-iOS-Port/build/DeepAI-Code-iOS-0.3.40-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Validate original Node server startup (not just IPA compilation)
        shell: bash
        run: |
          if [ ! -s DeepAI-iOS-Port/build/diagnostics/embedded-node.log ]; then
            echo "::error::The original DeepAI backend did not produce an iOS startup log"
            exit 1
          fi
          if ! grep -q 'DeepAI Code server is ready' DeepAI-iOS-Port/build/diagnostics/embedded-node.log; then
            tail -50 DeepAI-iOS-Port/build/diagnostics/embedded-node.log
            echo "::error::The original DeepAI backend has not reached ready on iOS"
            exit 1
          fi
          echo "Original DeepAI server started successfully inside iOS Simulator"
