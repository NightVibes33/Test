name: Build IOSurface UAF research IPA

on:
  push:
    branches:
      - iosurface-uaf-ipa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build arm64 iOS research app (unsigned)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Fetch exact upstream research revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Kimi-2011/ios27-iosurface-uaf.git upstream
          git -C upstream checkout --detach 601f1460843cb52d1f593901af9bdbf20a6598c0
          test "$(git -C upstream rev-parse HEAD)" = 601f1460843cb52d1f593901af9bdbf20a6598c0
          test -s upstream/harness/israce/main.panic.m
          shasum -a 256 upstream/harness/israce/main.panic.m

      - name: Prepare original repro with explicit launch confirmation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload/IOSurfaceResearch.app build
          cp upstream/harness/israce/main.panic.m build/main.m
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          p = Path("build/main.m")
          source = p.read_text()
          # Keep the upstream research body unchanged. The only runtime change is
          # replacing launch-time execution with a user-tapped Start button.
          marker = "    dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(kWatchdog * NSEC_PER_SEC)),"
          tail = "    return YES;\n}\n@end"
          assert source.count(marker) == 1, "Upstream run entry point changed"
          assert source.count(tail) == 1, "Upstream app delegate changed"
          source = source.replace(
              marker,
              """    UIButton *start = [UIButton buttonWithType:UIButtonTypeSystem];
              start.frame = CGRectMake(16, 110, self.window.bounds.size.width - 32, 90);
              start.backgroundColor = [UIColor colorWithRed:0.10 green:0.22 blue:0.19 alpha:1];
              [start setTitle:@"Run crash reproduction" forState:UIControlStateNormal];
              [start setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              start.titleLabel.font = [UIFont boldSystemFontOfSize:19];
              start.layer.cornerRadius = 14;
              [start addTarget:self action:@selector(startTest:) forControlEvents:UIControlEventTouchUpInside];
              [root.view addSubview:start];
              return YES;
          }
          - (void)startTest:(UIButton *)sender {
              sender.enabled = NO;
              sender.hidden = YES;
              self.label.text = @"Running upstream IOSurface UAF crash reproduction...";
          """ + marker,
              1,
          )
          source = source.replace(tail, "}\n@end", 1)
          # Files visibility for log recovery if the app or device restarts.
          old = "gTmp = [NSTemporaryDirectory() copy];"
          assert source.count(old) == 1
          source = source.replace(old, 'gTmp = [[NSHomeDirectory() stringByAppendingPathComponent:@"Documents"] copy];', 1)
          source = source.replace(
              'lab.text = @"israce: IOSurface +0xf1";',
              'lab.text = @"IOSurface UAF research (iOS 27.0.1). WARNING: this experiment may kernel panic/reboot the iPhone. Save all work before tapping Run. Logs are in Files > On My iPhone > IOSurface Research.";',
              1,
          )
          p.write_text(source)
          info = {
              "CFBundleDevelopmentRegion": "en",
              "CFBundleDisplayName": "IOSurface Research",
              "CFBundleExecutable": "IOSurfaceResearch",
              "CFBundleIdentifier": "com.nightvibes33.iosurfaceuaf",
              "CFBundleInfoDictionaryVersion": "6.0",
              "CFBundleName": "IOSurfaceResearch",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": "1.0",
              "CFBundleVersion": "1",
              "LSRequiresIPhoneOS": True,
              "MinimumOSVersion": "16.0",
              "UIDeviceFamily": [1, 2],
              "UIFileSharingEnabled": True,
              "LSSupportsOpeningDocumentsInPlace": True,
              "UILaunchScreen": {},
              "UIRequiredDeviceCapabilities": ["arm64"],
          }
          with open("Payload/IOSurfaceResearch.app/Info.plist", "wb") as f:
              plistlib.dump(info, f)
          Path("Payload/IOSurfaceResearch.app/PkgInfo").write_bytes(b"APPL????")
          PY

      - name: Compile iPhoneOS arm64 native executable
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 \
            -isysroot "$SDK" -fobjc-arc -O2 -Wno-deprecated-declarations \
            build/main.m -o Payload/IOSurfaceResearch.app/IOSurfaceResearch \
            -framework UIKit -framework Foundation -framework CoreFoundation \
            -framework CoreGraphics -framework IOKit -framework Metal
          xcrun lipo -archs Payload/IOSurfaceResearch.app/IOSurfaceResearch | grep -w arm64
          file Payload/IOSurfaceResearch.app/IOSurfaceResearch
          plutil -lint Payload/IOSurfaceResearch.app/Info.plist

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/zip -qr -X IOSurfaceResearch-unsigned.ipa Payload
          unzip -t IOSurfaceResearch-unsigned.ipa | tail -2
          unzip -Z -1 IOSurfaceResearch-unsigned.ipa | grep -Fx Payload/IOSurfaceResearch.app/IOSurfaceResearch
          shasum -a 256 IOSurfaceResearch-unsigned.ipa

      - name: Publish unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: IOSurfaceResearch-unsigned-ipa
          path: IOSurfaceResearch-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
