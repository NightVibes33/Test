name: CloudKit real-account harness check

on:
  push:
    branches:
      - apple-bounty-services-recon-20260928
    paths:
      - "apple-services-recon/cloudkit_real_account_harness.py"
      - "apple-services-recon/cloudkit_iphone_real_account.py"
      - "real-account/*.html"
      - "real-account/serve-ish.sh"
      - "real-account/README.md"
      - ".github/workflows/cloudkit-real-account-harness-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: |
          python3 -m py_compile apple-services-recon/cloudkit_real_account_harness.py apple-services-recon/cloudkit_iphone_real_account.py

      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, re
          p="apple-services-recon/cloudkit_iphone_real_account.py"
          spec=importlib.util.spec_from_file_location("iphone_harness",p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          out=pathlib.Path("/tmp/ckjs")
          out.mkdir(exist_ok=True)
          n=0
          for label,html in (("victim",m.VICTIM_HTML),("attacker",m.ATTACKER_HTML)):
              for script in re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>",html,re.I|re.S):
                  n+=1
                  (out/f"{label}-{n}.js").write_text(script)
          print(f"Extracted {n} inline scripts")
          PY
          for f in /tmp/ckjs/*.js; do node --check "$f"; done

      - name: Validate static iSH browser harness
        run: |
          set -euo pipefail
          sh -n real-account/serve-ish.sh
          rm -rf /tmp/ckjs-static
          mkdir -p /tmp/ckjs-static
          python3 - <<'PY'
          import pathlib, re
          out=pathlib.Path("/tmp/ckjs-static")
          for label in ("victim","attacker"):
              html=pathlib.Path(f"real-account/{label}.html").read_text()
              scripts=re.findall(r"<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>",html,re.I|re.S)
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in {label}.html")
              for i,script in enumerate(scripts,1):
                  (out/f"{label}-{i}.js").write_text(script)
          victim=pathlib.Path("real-account/victim.html").read_text()
          if 'value="iCloud.com.nightvibes.prism" readonly' not in victim:
              raise SystemExit("Victim page is not pinned to Chattest container")
          if 'const SENTINEL="OAI_REAL_ACCOUNT_TEST_CKSESSION_20260928"' not in victim:
              raise SystemExit("Victim sentinel declaration missing")
          print("Static iSH harness preflight OK")
          PY
          for f in /tmp/ckjs-static/*.js; do node --check "$f"; done

      - name: Local server smoke test
        run: |
          python3 apple-services-recon/cloudkit_iphone_real_account.py >/tmp/ck-harness.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS http://localhost:18134/ | grep -q "CloudKit real-account test"
          curl -fsS http://localhost:18133/ | grep -q "CloudKit victim"

      - name: Ensure no literal Apple account or token is committed
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          files=[
              pathlib.Path("apple-services-recon/cloudkit_real_account_harness.py"),
              pathlib.Path("apple-services-recon/cloudkit_iphone_real_account.py"),
          ]
          text="\n".join(p.read_text() for p in files)
          failures=[]
          if re.search(r"[A-Za-z0-9._%+-]+@icloud\.com", text, re.I):
              failures.append("literal iCloud email")
          if re.search(r"CLOUDKIT_API_TOKEN\s*=\s*['\"][A-Za-z0-9]", text):
              failures.append("literal CloudKit API token")
          if failures:
              print("Unsafe committed value(s): "+", ".join(failures))
              sys.exit(1)
          print("Credential-literal scan clean.")
          PY
