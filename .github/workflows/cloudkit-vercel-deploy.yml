name: CloudKit Vercel dual-origin deploy

on:
  push:
    branches:
      - apple-bounty-services-recon-20260928
    paths:
      - "vercel/cloudkit-victim/**"
      - "vercel/cloudkit-attacker/**"
      - ".github/workflows/cloudkit-vercel-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_SCOPE: bobbytatum12345-5121s-projects
      VICTIM_PROJECT: nightvibes33-chattest-victim
      ATTACKER_PROJECT: nightvibes33-chattest-attacker
      VICTIM_URL: https://nightvibes33-chattest-victim.vercel.app
      ATTACKER_URL: https://nightvibes33-chattest-attacker.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel token
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Missing repository secret VERCEL_TOKEN"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create and link victim project
        run: |
          set -euo pipefail
          vercel project add "$VICTIM_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/tmp/victim-project.log 2>&1 || true
          vercel link             --cwd vercel/cloudkit-victim             --yes             --project "$VICTIM_PROJECT"             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN"

      - name: Deploy victim production origin
        run: |
          set -euo pipefail
          vercel deploy             --cwd vercel/cloudkit-victim             --prod             --yes             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN" | tee /tmp/victim-deploy.log

      - name: Verify victim production origin
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             --retry 10 --retry-delay 2 --retry-all-errors             "$VICTIM_URL/" | grep -q "CloudKit JS real-account validation"

      - name: Create and link attacker project
        run: |
          set -euo pipefail
          vercel project add "$ATTACKER_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/tmp/attacker-project.log 2>&1 || true
          vercel link             --cwd vercel/cloudkit-attacker             --yes             --project "$ATTACKER_PROJECT"             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN"

      - name: Deploy attacker production origin
        run: |
          set -euo pipefail
          vercel deploy             --cwd vercel/cloudkit-attacker             --prod             --yes             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN" | tee /tmp/attacker-deploy.log

      - name: Verify attacker production origin
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             --retry 10 --retry-delay 2 --retry-all-errors             "$ATTACKER_URL/" | grep -q "$VICTIM_URL"

      - name: Deployment summary
        run: |
          {
            echo "## CloudKit Vercel PoC"
            echo
            echo "- Victim: $VICTIM_URL"
            echo "- Attacker: $ATTACKER_URL"
            echo "- Container: iCloud.com.nightvibes.prism"
            echo "- Environment: development"
            echo
            echo "Add the victim origin to the temporary CloudKit Development Web API token's allowed origins."
          } >> "$GITHUB_STEP_SUMMARY"
