name: Deploy CloudKit PoC to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - apple-bounty-services-recon-20260928
    paths:
      - "vercel/cloudkit-victim/**"
      - "vercel/cloudkit-attacker/**"
      - ".github/workflows/vercel-cloudkit-poc.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TEAM_ID: team_2IDA1MMBi6HRwl1QLav4nA5f
      VERCEL_SCOPE: bobbytatum12345-5121s-projects
      VERCEL_CLI_VERSION: "59.1.4"
      VICTIM_PROJECT: nightvibes33-chattest-victim
      ATTACKER_PROJECT: nightvibes33-chattest-attacker
      VICTIM_STABLE_URL: https://nightvibes33-chattest-victim.vercel.app
      ATTACKER_STABLE_URL: https://nightvibes33-chattest-attacker.vercel.app
      VICTIM_IMPORT_URL: "https://vercel.com/new/clone?repository-url=https%3A%2F%2Fgithub.com%2FNightVibes33%2FTest%2Ftree%2Fapple-bounty-services-recon-20260928%2Fvercel%2Fcloudkit-victim&project-name=nightvibes33-chattest-victim&repository-name=nightvibes33-chattest-victim"
      ATTACKER_IMPORT_URL: "https://vercel.com/new/clone?repository-url=https%3A%2F%2Fgithub.com%2FNightVibes33%2FTest%2Ftree%2Fapple-bounty-services-recon-20260928%2Fvercel%2Fcloudkit-attacker&project-name=nightvibes33-chattest-attacker&repository-name=nightvibes33-chattest-attacker"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: apple-bounty-services-recon-20260928

      - name: Detect Vercel access token
        id: auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is available; automatic deployment enabled."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not configured; publishing one-click import links instead."
          fi

      - name: Link or create Vercel projects
        if: steps.auth.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          ensure_project() {
            name="$1"
            dir="$2"

            tmp="$(mktemp)"
            status="$(curl -sS -o "$tmp" -w '%{http_code}'               -H "Authorization: Bearer $VERCEL_TOKEN"               "https://api.vercel.com/v9/projects/$name?teamId=$VERCEL_TEAM_ID")"

            if [ "$status" = "404" ]; then
              curl -fsS                 -X POST                 -H "Authorization: Bearer $VERCEL_TOKEN"                 -H "Content-Type: application/json"                 "https://api.vercel.com/v10/projects?teamId=$VERCEL_TEAM_ID"                 -d "{\"name\":\"$name\"}" > "$tmp"
            elif [ "$status" != "200" ]; then
              cat "$tmp" >&2
              echo "::error::Unable to resolve Vercel project $name (HTTP $status)"
              exit 1
            fi

            project_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$tmp")"
            mkdir -p "$dir/.vercel"
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$project_id" > "$dir/.vercel/project.json"
            echo "$name -> $project_id"
          }

          ensure_project "$VICTIM_PROJECT" vercel/cloudkit-victim
          ensure_project "$ATTACKER_PROJECT" vercel/cloudkit-attacker

      - name: Deploy victim origin
        if: steps.auth.outputs.has_token == 'true'
        id: victim
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@$VERCEL_CLI_VERSION deploy             --prod --yes             --token "$VERCEL_TOKEN"             --scope "$VERCEL_SCOPE"             --cwd vercel/cloudkit-victim | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Victim: $url"

      - name: Verify victim deployment
        if: steps.auth.outputs.has_token == 'true'
        run: |
          set -euo pipefail
          curl -fsS "${{ steps.victim.outputs.url }}" | grep -q "CloudKit JS real-account validation"

      - name: Deploy attacker origin
        if: steps.auth.outputs.has_token == 'true'
        id: attacker
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@$VERCEL_CLI_VERSION deploy             --prod --yes             --token "$VERCEL_TOKEN"             --scope "$VERCEL_SCOPE"             --cwd vercel/cloudkit-attacker | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Attacker: $url"

      - name: Verify attacker deployment
        if: steps.auth.outputs.has_token == 'true'
        run: |
          set -euo pipefail
          curl -fsS "${{ steps.attacker.outputs.url }}" | grep -q "Cross-origin sender"

      - name: Publish automatic deployment URLs
        if: steps.auth.outputs.has_token == 'true'
        env:
          VICTIM_URL: ${{ steps.victim.outputs.url }}
          ATTACKER_URL: ${{ steps.attacker.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "## CloudKit Vercel PoC"
            echo
            echo "- Victim deployment: $VICTIM_URL"
            echo "- Attacker deployment: $ATTACKER_URL"
            echo "- Stable victim origin: $VICTIM_STABLE_URL"
            echo "- Stable attacker origin: $ATTACKER_STABLE_URL"
            echo "- Container: iCloud.com.nightvibes.prism"
            echo "- Environment: development"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish one-click Vercel imports
        if: steps.auth.outputs.has_token != 'true'
        run: |
          {
            echo "## CloudKit Vercel PoC — import required"
            echo
            echo "No VERCEL_TOKEN is stored in this GitHub repository."
            echo
            echo "Use the two Vercel imports below; they create separate browser origins:"
            echo
            echo "- Victim: $VICTIM_IMPORT_URL"
            echo "- Attacker: $ATTACKER_IMPORT_URL"
            echo
            echo "Expected stable victim origin: $VICTIM_STABLE_URL"
            echo "Expected stable attacker origin: $ATTACKER_STABLE_URL"
            echo
            echo "Use only Chattest / iCloud.com.nightvibes.prism in Development."
          } >> "$GITHUB_STEP_SUMMARY"
