name: Wolt scoped recon

on:
  push:
    branches:
      - h1/wolt-2026-10-04
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-config:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract current Wolt auth configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          H1='X-HackerOne-Research: zyn33'
          UA='User-Agent: hackerone-zyn33'
          APP='https://wolt-com-static-assets.wolt.com/app-6aff8a77c78cb00e.js'

          curl --silent --show-error --max-time 20             -H "$H1" -H "$UA" "$APP" -o evidence/app.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("evidence/app.js").read_text(errors="replace")
          needles=[
              "authentication.wolt.com",
              "oauth2/authorize",
              "oauth2/token",
              "loginRedirectUri",
              "logoutRedirectUri",
              "clientId",
              "userInfoServiceUrl",
              "authService",
              "711854"
          ]
          out=[]
          for needle in needles:
              pos=0
              count=0
              while True:
                  i=s.find(needle,pos)
                  if i<0:
                      break
                  count+=1
                  out.append(f"===== {needle} #{count} @ {i} =====\n{s[max(0,i-1800):i+4200]}\n")
                  pos=i+len(needle)
                  if count>=12:
                      break
          Path("evidence/auth-config-context.txt").write_text("\n".join(out))
          urls=sorted(set(re.findall(r"https://[A-Za-z0-9._-]*wolt\.com[^\"'\s<>]+",s)))
          Path("evidence/wolt-urls.txt").write_text("\n".join(urls)+"\n")
          PY

          sed -n '1,300p' evidence/auth-config-context.txt
          echo '===== WOLT URLS ====='
          sed -n '1,260p' evidence/wolt-urls.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: wolt-auth-config
          path: evidence/
          if-no-files-found: error
