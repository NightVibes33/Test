name: H1 BCNY Dia Windows package discovery

on:
  workflow_dispatch:
  push:
    branches:
      - h1-bcny-dia-windows
    paths:
      - ".github/workflows/h1-bcny-dia-windows.yml"

jobs:
  inspect-official-dia-page:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Inspect official Dia Windows page and first-party scripts
        shell: pwsh
        run: |
          @'
          import re
          import urllib.request
          from urllib.parse import urljoin, urlparse

          base = "https://www.diabrowser.com/windows"
          headers = {"User-Agent": "Mozilla/5.0 HackerOne/NightVibes33"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "replace")

          html = get(base)
          print("PAGE_BYTES", len(html))

          url_re = re.compile(r'https?://[^"\\'<>\\s]+', re.I)
          direct = sorted(set(url_re.findall(html)))
          print("=== DIRECT CANDIDATES ===")
          for u in direct:
              if re.search(r'windows|win32|win64|x64|msix|msi|exe|appinstaller|download|installer|update|release', u, re.I):
                  print(u)

          srcs = re.findall(r'<script[^>]+src=["\\']([^"\\']+)["\\']', html, re.I)
          scripts = []
          for src in srcs:
              u = urljoin(base, src)
              if urlparse(u).hostname and urlparse(u).hostname.endswith("diabrowser.com"):
                  scripts.append(u)
          scripts = sorted(set(scripts))

          print("=== FIRST PARTY SCRIPTS ===")
          for s in scripts:
              print(s)

          patterns = [
              re.compile(r'https?://[^"\\'\\s<>]+\\.(?:exe|msix|msixbundle|msi|appinstaller)(?:\\?[^"\\'\\s<>]*)?', re.I),
              re.compile(r'https?://[^"\\'\\s<>]*(?:download|installer|update|release)[^"\\'\\s<>]*', re.I),
              re.compile(r'[^"\\'\\s<>]{0,120}(?:windows|win32|win64|x64)[^"\\'\\s<>]{0,180}', re.I),
          ]

          seen = set()
          for s in scripts:
              try:
                  body = get(s)
              except Exception as e:
                  print("SCRIPT_FETCH_FAILED", s, type(e).__name__, e)
                  continue
              for p in patterns:
                  for m in p.finditer(body):
                      v = m.group(0).replace("\\u0026", "&").replace("\\/", "/")
                      if v not in seen:
                          seen.add(v)
                          print("CANDIDATE", v)

          print("CANDIDATE_COUNT", len(seen))
          '@ | python -
