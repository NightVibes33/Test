name: Build ipadecrypt console (upstream)
on:
  push:
    branches:
      - 'temp/ios-native-ipa-decrypter-*'
    paths:
      - '.github/workflows/build-ipadecrypt-console.yml'
      - 'tools/ipadecrypt-console/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ipadecrypt console on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            exe: ipadecrypt.exe
          - os: macos-latest
            platform: macos
            exe: ipadecrypt
          - os: ubuntu-latest
            platform: linux
            exe: ipadecrypt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned MIT-licensed upstream source
        uses: actions/checkout@v4
        with:
          repository: londek/ipadecrypt
          ref: 9958b9298b62dfef5053d9b6491634c006f3d4e7
          path: upstream
          persist-credentials: false
      - name: Select upstream-required Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream/go.mod
          cache: false
      - name: Check source and compile native console
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "9958b9298b62dfef5053d9b6491634c006f3d4e7"
          mkdir -p out
          (cd upstream && go build -trimpath -ldflags="-s -w" -o "../out/${{ matrix.exe }}" ./cmd/ipadecrypt)
          test -s "out/${{ matrix.exe }}"
          "out/${{ matrix.exe }}" --help
          "out/${{ matrix.exe }}" decrypt --help
      - name: Package runnable console and instructions
        shell: bash
        run: |
          set -euo pipefail
          cp tools/ipadecrypt-console/README.md out/README.md
          cp tools/ipadecrypt-console/run-icarcast.ps1 out/run-icarcast.ps1
          cp tools/ipadecrypt-console/run-icarcast.sh out/run-icarcast.sh
          python - <<'PY'
          import hashlib, pathlib, zipfile, os
          label=os.environ['OS_LABEL']
          root=pathlib.Path('out')
          exe='ipadecrypt.exe' if label=='windows' else 'ipadecrypt'
          digest=hashlib.sha256((root/exe).read_bytes()).hexdigest()
          (root/'SHA256.txt').write_text(f'{digest}  {exe}\n')
          with zipfile.ZipFile(f'ipadecrypt-console-{label}.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=7) as z:
              for p in sorted(root.iterdir()):
                  z.write(p,p.name)
          with zipfile.ZipFile(f'ipadecrypt-console-{label}.zip') as z:
              assert z.testzip() is None
              assert exe in z.namelist()
          print(f'Package verification successful; {exe} sha256={digest}')
          PY
        env:
          OS_LABEL: ${{ matrix.platform }}
      - name: Upload runnable console artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipadecrypt-console-${{ matrix.platform }}
          path: ipadecrypt-console-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7
