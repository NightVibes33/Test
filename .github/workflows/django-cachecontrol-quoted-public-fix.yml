name: Validate quoted Cache-Control fix

on:
  workflow_dispatch:
  push:
    branches:
      - h1-django-cachecontrol-quoted-public
    paths:
      - django-cachecontrol-quoted-public-fix-validate.py
      - .github/workflows/django-cachecontrol-quoted-public-fix.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install current Django
        run: python -m pip install "Django @ git+https://github.com/django/django.git@9e06baf2e4dd17834b5deaf3a3e6ae3bff2fcf26"
      - name: Validate quote-aware parser behavior
        run: python django-cachecontrol-quoted-public-fix-validate.py
