name: GitLab EE credential-boundary audit

on:
  push:
    branches: [h1-gitlab-hidden-linked-item-real]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: docker pull gitlab/gitlab-ee:19.4.1-ee.0
      - name: Extract audit stream GraphQL and policies
        run: |
          docker run --rm gitlab/gitlab-ee:19.4.1-ee.0 bash -lc '
            cd /opt/gitlab/embedded/service/gitlab-rails
            files="$(grep -RIlE "secret_token|secretToken" ee/app/graphql 2>/dev/null | grep -Ei "audit|stream" | sort -u)"
            policies="$(find ee/app/policies -type f 2>/dev/null | grep -Ei "audit.*destination|streaming.*destination" | sort -u)"
            for f in $files $policies; do echo "===== $f ====="; cat "$f"; done
          ' > audit-stream-secret.txt
      - name: Extract Duo workflow GraphQL boundaries
        run: |
          docker run --rm gitlab/gitlab-ee:19.4.1-ee.0 bash -lc '
            cd /opt/gitlab/embedded/service/gitlab-rails
            files="$(find ee/app/graphql ee/app/finders ee/app/policies -type f 2>/dev/null | grep -Ei "duo_workflow|workflow_events|session_artifact" | sort -u)"
            for f in $files; do echo "===== $f ====="; cat "$f"; done
          ' > duo-workflow-auth.txt
      - name: Extract vulnerability mutation authorization
        run: |
          docker run --rm gitlab/gitlab-ee:19.4.1-ee.0 bash -lc '
            cd /opt/gitlab/embedded/service/gitlab-rails
            files="$(find ee/app/graphql ee/app/services ee/app/policies -type f 2>/dev/null | grep -Ei "vulnerabilit.*(dismiss|confirm|severity|create_issue)|vulnerabilities.*(dismiss|confirm|severity|create_issue)" | sort -u)"
            for f in $files; do echo "===== $f ====="; cat "$f"; done
          ' > vulnerability-mutations.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gitlab-ee-credential-boundary-audit
          path: |
            audit-stream-secret.txt
            duo-workflow-auth.txt
            vulnerability-mutations.txt
