name: GitLab 19.4.1 Manual API Auth Audit
on:
  push:
    branches: [h1-gitlab-api-manual-auth-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact GitLab release
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v19.4.1-ee https://gitlab.com/gitlab-org/gitlab.git gitlab
          cd gitlab
          git rev-parse HEAD | tee ../gitlab-revision.txt
          git describe --tags --exact-match | tee ../gitlab-tag.txt
      - name: Audit hand-rolled read authorization
        shell: bash
        run: |
          set -o pipefail
          cd gitlab
          {
            echo "=== API can_read helpers ==="
            git grep -n -C 16 -E "def can_read_|def readable\?|return true if" -- 'lib/api/**' 'ee/lib/api/**' || true
            echo
            echo "=== API read ability predicates ==="
            git grep -n -C 14 -E "can\?\(current_user, :read_|Ability\.allowed\?\(current_user, :read_" -- 'lib/api/**' 'ee/lib/api/**' || true
          } | tee ../manual-api-auth-audit.log
      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-manual-api-auth-audit
          path: |
            gitlab-revision.txt
            gitlab-tag.txt
            manual-api-auth-audit.log
