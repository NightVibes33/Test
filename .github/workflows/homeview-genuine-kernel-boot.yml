name: HomeView 27.2 - Experimental genuine Darwin kernel boot

on:
  push:
    branches: [temp/homeview-legacy-boot]
    paths:
      - '.github/workflows/homeview-genuine-kernel-boot.yml'
      - 'homeview-legacy/scripts/probe_homeview_boot.py'
      - 'homeview-legacy/scripts/boot_evidence.py'
      - 'homeview-legacy/scripts/patch_homeview_dtree.py'
      - 'homeview-legacy/scripts/patch_qemu_mmio_trace.py'
      - 'homeview-legacy/scripts/extract_j490_mmio_contract.py'
      - 'homeview-legacy/scripts/verify_j490_mmio_log.py'
      - 'homeview-legacy/scripts/scan_original_kernelcache.py'
      - 'homeview-legacy/tests/test_original_kernelcache.py'
      - 'homeview-legacy/scripts/analyze_j490_kexts.py'
      - 'homeview-legacy/tests/test_j490_kexts.py'
      - 'homeview-legacy/scripts/inspect_original_iokit_classes.py'
      - 'homeview-legacy/tests/test_original_iokit_classes.py'
      - 'homeview-legacy/scripts/analyze_ans2_boot.py'
      - 'homeview-legacy/tests/test_ans2_boot.py'
      - 'homeview-legacy/scripts/scan_homeview_ota_layout.py'
      - 'homeview-legacy/tests/test_homeview_ota_layout.py'
      - 'homeview-legacy/tests/test_j490_mmio_contract.py'
      - 'homeview-legacy/tests/test_mmio_trace_patch.py'
      - 'homeview-legacy/scripts/verify_ans_adt_probe.py'
      - 'homeview-legacy/tests/test_ans_adt_probe.py'
      - 'homeview-legacy/tests/test_boot_evidence.py'
      - 'homeview-legacy/profiles/pumpkin-homeaccessory-j490.json'
      - 'homeview-legacy/scripts/pumpkin_personality.py'
      - 'homeview-legacy/scripts/observe_pumpkin_boot.py'
      - 'homeview-legacy/scripts/verify_pumpkin_adt_pair.py'
      - 'homeview-legacy/scripts/compare_pumpkin_guest_pair.py'
      - 'homeview-legacy/tests/test_pumpkin_adt_pair.py'
      - 'homeview-legacy/tests/test_pumpkin_guest_pair.py'
      - 'homeview-legacy/tests/test_pumpkin_personality.py'
      - 'homeview-legacy/tests/test_pumpkin_observer.py'
  workflow_dispatch:

concurrency:
  group: homeview-real-j490-darwin-temp
  # Do not abort a 6.5 GB original-Apple-firmware run when research code changes.
  # Only one newer run may remain pending; the active evidence job finishes.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fast-evidence-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate genuine HomeView boot evidence stages
        run: |
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_boot_evidence.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_adt_hardware.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_real_guest_screen.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_mmio_trace_patch.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_pumpkin_personality.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_pumpkin_observer.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_pumpkin_adt_pair.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_pumpkin_guest_pair.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_ans_adt_probe.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_j490_mmio_contract.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_original_kernelcache.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_j490_kexts.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_original_iokit_classes.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_ans2_boot.py' -v
          python3 -m unittest discover -s homeview-legacy/tests -p 'test_homeview_ota_layout.py' -v
          python3 -m py_compile homeview-legacy/scripts/probe_homeview_boot.py
          python3 -m py_compile homeview-legacy/scripts/boot_evidence.py

  original-apple-kernel:
    needs: fast-evidence-validation
    runs-on: xcode-27
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Apple Silicon macOS 27 host and space
        run: |
          uname -m
          sw_vers
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          df -h "$RUNNER_TEMP"
          mkdir -p out
      - name: Install Apple IMG4 and QEMU build prerequisites
        run: |
          brew install blacktop/tap/ipsw || brew install ipsw
          brew install glib pixman capstone dtc libslirp gnutls pkg-config ninja meson
          ipsw --help >/dev/null
      - name: Restore reproducible Darwin QEMU build cache
        id: darwin-qemu-cache
        uses: actions/cache/restore@v4
        with:
          path: emulator/build/qemu-system-aarch64
          key: homeview-macos27-qemu-sptm-bad6336fb24-trace-${{ hashFiles('homeview-legacy/scripts/patch_qemu_mmio_trace.py') }}
      - name: Build Apple-specific QEMU TCG Darwin backend on macOS
        if: steps.darwin-qemu-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/jprx/qemu-sptm.git emulator
          git -C emulator checkout --detach bad6336fb24211f8c4e8e946c259bd5b12417340
          python3 homeview-legacy/scripts/patch_qemu_mmio_trace.py emulator/hw/arm/darwin.c
          mkdir emulator/build
          cd emulator/build
          ../configure --target-list=aarch64-softmmu --disable-pvg --disable-werror \
            --disable-docs --disable-gtk --disable-sdl
          make -j 3
          ./qemu-system-aarch64 -M help | grep -E '(^|[[:space:]])darwin([[:space:]]|$)'
      - name: Save compiled Darwin emulator before experimental boot attempt
        if: steps.darwin-qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: emulator/build/qemu-system-aarch64
          key: homeview-macos27-qemu-sptm-bad6336fb24-trace-${{ hashFiles('homeview-legacy/scripts/patch_qemu_mmio_trace.py') }}
      - name: Validate built or restored Apple-specific QEMU
        run: |
          test -x emulator/build/qemu-system-aarch64
          emulator/build/qemu-system-aarch64 -M help | grep -E '(^|[[:space:]])darwin([[:space:]]|$)'
          test "$(strings emulator/build/qemu-system-aarch64 | grep -F -c 'HOMEVIEW_MMIO_TRACE installed')" -ge 1
          echo "VALIDATED: actual traced QEMU binary, no stale uninstrumented cache"
      - name: Build selective Apple AEA extractor
        run: |
          git clone --depth 1 https://github.com/dhinakg/aeota.git aeota
          make -C aeota -j2
      - name: Validate evidence classifier before expensive firmware work
        run: python3 -m unittest discover -s homeview-legacy/tests -p 'test_boot_evidence.py' -v
      - name: Resolve official HomeView OTA and key without logging the key
        run: |
          python3 - <<'PY'
          import base64,os,pathlib,re,urllib.request,urllib.parse
          with urllib.request.urlopen('https://raw.githubusercontent.com/Lakr233/vphone-cli/main/VPhoneKit/VPhoneCoreKit/Firmware/VPhoneFirmwareCatalog.swift',timeout=30) as f:
              text=f.read(1000000).decode()
          match=re.search(r'productType:\s*"HomeAccessory17,1",\s*version:\s*"27\.2",\s*build:\s*"24V514",\s*url:\s*"([^"]+)",\s*size:\s*([\d_]+),\s*key:\s*"([^"]+)"',text)
          assert match,'Official HomeView OTA missing'
          url,size,key=match.group(1),int(match.group(2).replace('_','')),match.group(3)
          assert size==6509559808 and urllib.parse.urlsplit(url).hostname=='updates.cdn-apple.com'
          assert len(base64.b64decode(key,validate=True))==32
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          (tmp/'hv-url').write_text(url)
          (tmp/'hv-key').write_text(key)
          print('Verified HomeView 27.2/24V514 source and official AEA key')
          PY
      - name: Check capacity and fetch actual 6.5GB Apple signed HomeView firmware
        run: |
          FREE_KB="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          test "$FREE_KB" -ge 8500000
          curl -fL --retry 3 --connect-timeout 30 --max-time 2400 \
            -o "$RUNNER_TEMP/HomeView.aea" "$(cat "$RUNNER_TEMP/hv-url")"
          test "$(stat -f %z "$RUNNER_TEMP/HomeView.aea")" = 6509559808
      - name: Extract authentic J490 kernel, device tree, trustcache, SPTM and TXM
        run: |
          set +x
          KEY="$(cat "$RUNNER_TEMP/hv-key")"
          mkdir -p "$RUNNER_TEMP/hv-extracted" "$RUNNER_TEMP/hv-firmware"
          ./aeota/aastuff_standalone -i "$RUNNER_TEMP/HomeView.aea" \
            -o "$RUNNER_TEMP/hv-extracted" \
            -r '^AssetData/boot/(kernelcache\.release\.homeaccessory17|Firmware/all_flash/DeviceTree\.j490ap\.im4p|Firmware/sptm\.t8140\.release\.im4p|Firmware/txm\.appletvos\.release\.im4p|141-21782-189\.dmg|Firmware/141-21782-189\.dmg\.trustcache|Firmware/arm64eSURamDisk\.dmg\.trustcache)$|^AssetData/payload/replace/usr/standalone/update/ramdisk/arm64eSURamDisk\.dmg$' \
            -k "$KEY" > out/selective-extraction.log 2>&1
          BASE="$RUNNER_TEMP/hv-extracted/AssetData/boot"
          DEST="$RUNNER_TEMP/hv-firmware"
          test -s "$BASE/kernelcache.release.homeaccessory17"
          test -s "$BASE/Firmware/all_flash/DeviceTree.j490ap.im4p"
          test -s "$BASE/Firmware/sptm.t8140.release.im4p"
          test -s "$BASE/Firmware/txm.appletvos.release.im4p"
          test -s "$BASE/141-21782-189.dmg"
          test -s "$BASE/Firmware/141-21782-189.dmg.trustcache"
          test -s "$BASE/Firmware/arm64eSURamDisk.dmg.trustcache"
          test -s "$RUNNER_TEMP/hv-extracted/AssetData/payload/replace/usr/standalone/update/ramdisk/arm64eSURamDisk.dmg"
          ipsw img4 im4p extract "$BASE/kernelcache.release.homeaccessory17" -o "$DEST/bootkc"
          python3 homeview-legacy/scripts/scan_original_kernelcache.py \
            --kernelcache "$DEST/bootkc" \
            --output out/homeview-original-kernelcache-driver-markers.json
          ipsw img4 im4p extract "$BASE/Firmware/all_flash/DeviceTree.j490ap.im4p" -o "$DEST/dtree"
          ipsw img4 im4p extract "$BASE/Firmware/sptm.t8140.release.im4p" -o "$DEST/sptm"
          ipsw img4 im4p extract "$BASE/Firmware/txm.appletvos.release.im4p" -o "$DEST/txm"
          ipsw img4 im4p extract "$BASE/Firmware/141-21782-189.dmg.trustcache" -o "$DEST/ramdisk.tc"
          cp "$BASE/141-21782-189.dmg" "$DEST/ramdisk.dmg"
          ipsw img4 im4p extract "$BASE/Firmware/arm64eSURamDisk.dmg.trustcache" -o "$DEST/ramdisk-su.tc"
          # The .dmg extension is misleading here: Apple Archive contains an IM4P.
          # QEMU rejects IM4P wrappers and requires the unwrapped payload bytes.
          ipsw img4 im4p extract \
            "$RUNNER_TEMP/hv-extracted/AssetData/payload/replace/usr/standalone/update/ramdisk/arm64eSURamDisk.dmg" \
            -o "$DEST/ramdisk-su.dmg"
          file "$DEST/ramdisk-su.dmg"
          python3 - <<'PY'
          import os,pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'hv-firmware'/'ramdisk-su.dmg'
          blob=path.read_bytes()[:32]
          assert not blob.startswith(b'IM4P'), 'SU ramdisk still wrapped in IM4P'
          assert len(blob)==32 and path.stat().st_size > 4096, 'SU ramdisk payload missing'
          print('SU payload extracted from IM4P; bytes:',path.stat().st_size, 'prefix:',blob[:8].hex())
          PY
          hdiutil imageinfo "$DEST/ramdisk-su.dmg" > out/su-ramdisk-imageinfo.txt 2>&1 || true
          test -s "$DEST/ramdisk-su.dmg"
          test -s "$DEST/ramdisk-su.tc"
          # Modify the ORIGINAL ADT in one decode/fixup/encode pass.
          # A second decode/re-encode of darwin-vm output caused silent stalls.
          git clone --depth=1 https://github.com/jprx/darwin-vm.git darwin-tools
          mv "$DEST/dtree" "$DEST/dtree.raw"
          python3 homeview-legacy/scripts/patch_homeview_dtree.py \
            "$DEST/dtree.raw" "$DEST/dtree" --upstream darwin-tools/dt_fixup.py \
            --nvram darwin-tools/nvram.bin --mode remove \
            --profile homeview-legacy/profiles/pumpkin-homeaccessory-j490.json \
            --report out/homeview-dtree-dock-fixup.json
          # Exact same Apple source, fixup, and dock removal. Only this second
          # output adds the synthetic /chosen/PumpkinMode=1 test property.
          python3 homeview-legacy/scripts/patch_homeview_dtree.py \
            "$DEST/dtree.raw" "$DEST/dtree.pumpkin" --upstream darwin-tools/dt_fixup.py \
            --nvram darwin-tools/nvram.bin --mode remove \
            --profile homeview-legacy/profiles/pumpkin-homeaccessory-j490.json \
            --pumpkin-probe --report out/homeview-dtree-dock-pumpkin.json
          python3 homeview-legacy/scripts/verify_pumpkin_adt_pair.py \
            "$DEST/dtree" "$DEST/dtree.pumpkin" \
            --upstream darwin-tools/dt_fixup.py \
            --report out/homeview-pumpkin-pair-verification.json
          # Separate hardware driver-matching diagnostic. Native compatible
          # strings are kept, but real ANS MMIO, interrupts, DMA and storage
          # protocols are still NOT implemented.
          python3 homeview-legacy/scripts/patch_homeview_dtree.py \
            "$DEST/dtree.raw" "$DEST/dtree.ans-probe" \
            --upstream darwin-tools/dt_fixup.py \
            --nvram darwin-tools/nvram.bin --mode remove \
            --profile homeview-legacy/profiles/pumpkin-homeaccessory-j490.json \
            --ans-binding-probe --report out/homeview-dtree-ans-binding.json
          python3 homeview-legacy/scripts/verify_ans_adt_probe.py \
            "$DEST/dtree" "$DEST/dtree.ans-probe" "$DEST/dtree.raw" \
            --upstream darwin-tools/dt_fixup.py \
            --report out/homeview-ans-binding-verification.json
          python3 homeview-legacy/scripts/patch_homeview_dtree.py \
            "$DEST/dtree.raw" "$DEST/dtree.neutralized" --upstream darwin-tools/dt_fixup.py \
            --nvram darwin-tools/nvram.bin --mode neutralize \
            --profile homeview-legacy/profiles/pumpkin-homeaccessory-j490.json \
            --report out/homeview-dtree-dock-neutralized.json
          python3 darwin-tools/dt_fixup.py -nvram darwin-tools/nvram.bin \
            "$DEST/dtree.raw" "$DEST/dtree.baseline"
          for tree in dtree dtree.pumpkin dtree.ans-probe dtree.neutralized dtree.baseline; do test -s "$DEST/$tree"; done
          python3 homeview-legacy/scripts/inspect_adt_hardware.py "$DEST/dtree.raw" \
            --upstream darwin-tools/dt_fixup.py \
            --output out/homeview-j490-hardware-inventory.json
          python3 homeview-legacy/scripts/extract_j490_mmio_contract.py \
            "$DEST/dtree.raw" --upstream darwin-tools/dt_fixup.py \
            --output out/homeview-j490-mmio-contract.json
          echo "Generated one-pass J490 trees plus unmodified qemu-sptm baseline."
          for f in bootkc dtree sptm txm ramdisk.tc ramdisk.dmg ramdisk-su.tc ramdisk-su.dmg; do test -s "$DEST/$f"; done
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'hv-firmware'
          files={}
          for path in root.iterdir():
              if path.is_file():
                  with path.open('rb') as f: prefix=f.read(16)
                  files[path.name]={'bytes':path.stat().st_size,'first16':prefix.hex()}
          pathlib.Path('out/genuine-darwin-boot-inputs.json').write_text(json.dumps(files,indent=2)+'\n')
          print(json.dumps(files,indent=2))
          PY
      - name: Inventory genuine HomeView kernelcache KEXT IDs and IOKit personalities
        if: always()
        run: |
          STATUS=125
          KEXTS="$RUNNER_TEMP/homeview-kexts.json"
          if [[ -s "$RUNNER_TEMP/hv-firmware/bootkc" ]]; then
            set +e
            ipsw kernel kexts --json "$RUNNER_TEMP/hv-firmware/bootkc" \
              > "$KEXTS" 2> "$RUNNER_TEMP/homeview-kexts-errors.txt"
            STATUS=$?
            set -e
          fi
          python3 homeview-legacy/scripts/analyze_j490_kexts.py \
            --kext-json "$KEXTS" \
            --contract out/homeview-j490-mmio-contract.json \
            --list-exit-code "$STATUS" \
            --output out/homeview-original-kext-iokit-personalities.json
          rm -f "$KEXTS" "$RUNNER_TEMP/homeview-kexts-errors.txt"
      - name: Inspect original Apple ANS2 RTBuddy and DCP C++ vtables and methods
        if: always()
        run: |
          if [[ -s "$RUNNER_TEMP/hv-firmware/bootkc" ]]; then
            python3 homeview-legacy/scripts/inspect_original_iokit_classes.py \
              --kernelcache "$RUNNER_TEMP/hv-firmware/bootkc" \
              --output out/homeview-original-iokit-cpp-methods.json
          else
            echo "Original Apple kernelcache not extracted; no vtable inspection"
          fi
      - name: Compare original and patched J490 device trees with real XNU
        run: python3 homeview-legacy/scripts/probe_homeview_boot.py
      - name: Report observed Pumpkin/HomeAccessory queries and shell selections
        if: always()
        run: |
          python3 homeview-legacy/scripts/observe_pumpkin_boot.py \
            --logs out/native-homeview-*-serial.log \
            --output out/pumpkin-guest-observations.json
          python3 homeview-legacy/scripts/compare_pumpkin_guest_pair.py \
            --boot out/native-homeview-kernel-result.json \
            --observations out/pumpkin-guest-observations.json \
            --adt out/homeview-pumpkin-pair-verification.json \
            --ans-adt out/homeview-ans-binding-verification.json \
            --qemu-logs out/qemu-*.log \
            --output out/pumpkin-paired-guest-comparison.json
          python3 homeview-legacy/scripts/analyze_ans2_boot.py \
            --control out/native-homeview-baseline-software-update-serial.log \
            --experiment out/native-homeview-software-update-ans-binding-probe-serial.log \
            --qemu-log out/qemu-software-update-ans-binding-probe.log \
            --output out/homeview-ans2-runtime-matching.json
          if [[ -s out/homeview-j490-mmio-contract.json ]]; then
            python3 homeview-legacy/scripts/verify_j490_mmio_log.py \
              --contract out/homeview-j490-mmio-contract.json \
              --qemu-logs out/qemu-*.log \
              --output out/homeview-j490-mmio-trace-verification.json
          else
            echo "J490 hardware contract unavailable; firmware extraction/build did not finish"
          fi
      - name: Inventory real Apple OTA payload layout without redistributing files
        if: always()
        run: |
          set +x
          STATUS=125
          LISTING="$RUNNER_TEMP/homeview-ota-layout-list.txt"
          if [[ -s "$RUNNER_TEMP/HomeView.aea" && -s "$RUNNER_TEMP/hv-key" && -x ./aeota/aastuff_standalone ]]; then
            set +e
            ./aeota/aastuff_standalone -i "$RUNNER_TEMP/HomeView.aea" -l \
              -r '^AssetData/' -k "$(cat "$RUNNER_TEMP/hv-key")" \
              > "$LISTING" 2> "$RUNNER_TEMP/homeview-ota-listing-errors.log"
            STATUS=$?
            set -e
          fi
          python3 homeview-legacy/scripts/scan_homeview_ota_layout.py \
            --listing "$LISTING" --list-exit-code "$STATUS" \
            --output out/homeview-original-ota-layout.json
          rm -f "$LISTING" "$RUNNER_TEMP/homeview-ota-listing-errors.log"
      - name: Delete Apple system binaries and key from ephemeral runner
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/HomeView.aea" "$RUNNER_TEMP/hv-extracted" "$RUNNER_TEMP/hv-firmware" "$RUNNER_TEMP/hv-key" "$RUNNER_TEMP/hv-url"
      - name: Publish diagnostic logs and metadata only, never Apple binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-homeview-j490-darwin-boot-evidence
          path: |
            out/genuine-darwin-boot-inputs.json
            out/homeview-original-kernelcache-driver-markers.json
            out/homeview-original-kext-iokit-personalities.json
            out/homeview-original-iokit-cpp-methods.json
            out/homeview-ans2-runtime-matching.json
            out/homeview-original-ota-layout.json
            out/homeview-j490-hardware-inventory.json
            out/homeview-j490-mmio-contract.json
            out/homeview-j490-mmio-trace-verification.json
            out/pumpkin-guest-observations.json
            out/pumpkin-paired-guest-comparison.json
            out/homeview-dtree-dock-fixup.json
            out/homeview-dtree-dock-pumpkin.json
            out/homeview-pumpkin-pair-verification.json
            out/homeview-dtree-ans-binding.json
            out/homeview-ans-binding-verification.json
            out/homeview-dtree-dock-neutralized.json
            out/native-homeview-*-serial.log
            out/native-homeview-guest-frame-*.ppm
            out/homeview-*-result.json
            out/qemu-*.log
            out/native-homeview-kernel-result.json
            out/native-homeview-kernel-serial.log
            out/selective-extraction.log
            out/su-ramdisk-imageinfo.txt
          if-no-files-found: ignore
          retention-days: 7
