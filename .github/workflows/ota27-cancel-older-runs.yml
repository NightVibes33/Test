name: Cancel obsolete research-branch build runs

on:
  push:
    branches:
      - temp/ios27-airlift-ota-research
    paths:
      - ".github/workflows/ota27-cancel-older-runs.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-branch-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_RUN_ID: "41577217740"
    steps:
      - name: Cancel obsolete LiveContainer and OTA27 runs on OTA27 branch
        shell: bash
        run: |
          set -euo pipefail
          # Scope is ONLY the OTA27 research branch; do not touch HomeView,
          # unrelated branches, finished runs, or the latest OTA27 build.
          for workflow in ios-build.yml ota27-unsigned.yml; do
            echo "Checking ${workflow} on temp/ios27-airlift-ota-research"
            mapfile -t old < <(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=temp%2Fios27-airlift-ota-research&per_page=100" \
                --jq '.workflow_runs[] | select(.id != 41577217740) | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending") | .id'
            )
            echo "Found ${#old[@]} active obsolete ${workflow} runs"
            failed=0
            for run_id in "${old[@]}"; do
              [[ "${run_id}" != "${KEEP_RUN_ID}" ]] || exit 1
              echo "Canceling ${workflow} run ${run_id}"
              if ! gh api --method POST --silent \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"; then
                echo "::warning::Could not cancel ${run_id} normally"
                failed=$((failed + 1))
              fi
            done
            if [[ "${failed}" -ne 0 ]]; then
              echo "::error::${failed} normal cancellation requests failed for ${workflow}"
              exit 1
            fi
          done
          sleep 8
          # Force cancellation for any runners that did not honor graceful stop.
          for workflow in ios-build.yml ota27-unsigned.yml; do
            mapfile -t remaining < <(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=temp%2Fios27-airlift-ota-research&per_page=100" \
                --jq '.workflow_runs[] | select(.id != 41577217740) | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending") | .id'
            )
            for run_id in "${remaining[@]}"; do
              [[ "${run_id}" != "${KEEP_RUN_ID}" ]] || exit 1
              echo "Force-canceling stuck ${workflow} run ${run_id}"
              gh api --method POST --silent \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel"
            done
          done
          echo "All cancellation requests completed for obsolete branch runs."
