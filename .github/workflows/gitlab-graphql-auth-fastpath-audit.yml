name: GitLab 19.4.1 GraphQL Auth Fast-Path Audit

on:
  push:
    branches:
      - h1-gitlab-graphql-auth-fastpath-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact GitLab release
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v19.4.1-ee https://gitlab.com/gitlab-org/gitlab.git gitlab
          cd gitlab
          git rev-parse HEAD | tee ../gitlab-revision.txt
          git describe --tags --exact-match | tee ../gitlab-tag.txt

      - name: Find manual authorization fast paths
        shell: bash
        run: |
          set -o pipefail
          cd gitlab
          {
            echo "=== GraphQL read_work_item checks ==="
            git grep -n -C 10 -E "read_work_item|Ability\.allowed\?|can_read_.*item" -- 'app/graphql/**' 'ee/app/graphql/**' || true
            echo
            echo "=== same parent/type/confidentiality assumptions ==="
            git grep -n -C 12 -E "resource_parent|work_item_type_id|confidential.*==|namespace_id.*==" -- 'app/graphql/**' 'ee/app/graphql/**' || true
            echo
            echo "=== resolver return-true shortcuts ==="
            git grep -n -C 12 -E "return true if|return false unless" -- 'app/graphql/resolvers/**' 'ee/app/graphql/resolvers/**' || true
          } | tee ../graphql-auth-fastpath-audit.log

      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-graphql-auth-fastpath-audit
          path: |
            gitlab-revision.txt
            gitlab-tag.txt
            graphql-auth-fastpath-audit.log
