name: Build RokuCast Bridge APK
on:
  push:
    branches: [feature/rokucast-bridge-android-tv]
    paths:
      - 'RokuCastBridge/**'
      - '.github/workflows/rokucast-bridge-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: RokuCastBridge
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RokuCastBridge-debug-apk
          path: RokuCastBridge/app/build/outputs/apk/debug/app-debug.apk
