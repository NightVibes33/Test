name: GotPhoto public page check
on:
  push:
    paths:
      - ".github/workflows/gotphoto-page-check.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch customer page
        run: |
          set -euxo pipefail
          curl -A "Mozilla/5.0" -L --fail --max-time 30 -D headers.txt -o page.html "https://newcountryphoto.gotphoto.com/"
          echo "=== HEADERS ==="
          cat headers.txt
          echo "=== TITLE / FORMS / LINKS ==="
          python3 - <<'PY'
          from html.parser import HTMLParser
          import re
          from urllib.parse import urljoin
          html=open("page.html",encoding="utf-8",errors="replace").read()
          print("bytes",len(html))
          print("titles",re.findall(r"<title[^>]*>(.*?)</title>",html,re.I|re.S)[:3])
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.forms=[]; self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="form": self.forms.append({"action":a.get("action"),"method":a.get("method")})
                  for k in ("href","src"):
                      if a.get(k): self.links.append(urljoin("https://newcountryphoto.gotphoto.com/",a[k]))
          p=P(); p.feed(html)
          print("forms",p.forms)
          for x in p.links[:250]: print(x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gotphoto-page-check
          path: |
            page.html
            headers.txt
