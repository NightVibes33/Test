name: Django quoted Cache-Control auth isolation

on:
  workflow_dispatch:
  push:
    branches:
      - h1-django-cachecontrol-quoted-public

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: django-6.1.1
            install: Django==6.1.1
          - name: current-main
            install: git+https://github.com/django/django.git@9e06baf2e4dd17834b5deaf3a3e6ae3bff2fcf26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install target
        run: python -m pip install "${{ matrix.install }}"
      - name: Run regression
        shell: bash
        run: |
          set -o pipefail
          python django-cachecontrol-quoted-public.py 2>&1 | tee evidence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quoted-public-${{ matrix.name }}
          path: evidence.txt
