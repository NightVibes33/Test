name: Steal My Bitcoin CTF - local reproduction (no live exploit)

on:
  push:
    branches:
      - ctf/stealmybitcoin-health-20261025
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smbctf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controlled-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare isolated workspace and audited PoC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smbctf/public"
          cd "$RUNNER_TEMP/smbctf"
          curl -fsSL --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/KillaBoi/StealMyBitcoin-PoC/3244dd00ffc35ae23cb0aba2ee8536061e7ea516/stealmybitcoin_poc.py \
            -o stealmybitcoin_poc.py
          python3 -m py_compile stealmybitcoin_poc.py
          printf '%s\n' '<?php' "header('Content-Type: text/plain');" 'echo "PHP ", PHP_VERSION, "\\n";' 'echo "PID: ", getmypid(), "\\n";' > public/php-version.php
          printf '#!/bin/sh\nprintf "%s\\n" LOCAL_DUMMY_WIF_NEVER_USE\n' > print-flag
          chmod +x print-flag
          cat > nginx.conf <<'EOF'
          events {}
          http {
            server {
              listen 80;
              server_name _;
              location / {
                proxy_pass http://smbctf-php:8000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
              }
            }
          }
          EOF
      - name: Start disposable vulnerable PHP laboratory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/smbctf"
          docker network create smbctf
          docker run -d --name smbctf-php --network smbctf \
            --read-only --tmpfs /tmp:rw,size=32m,mode=1777 --memory 1g \
            -v "$PWD/public:/app:ro" \
            -v "$PWD/print-flag:/usr/local/bin/print-flag:ro" \
            -e PHP_CLI_SERVER_WORKERS=4 \
            php:8.4.26-fpm-alpine3.23 php -S 0.0.0.0:8000 -t /app
          docker run -d --name smbctf-nginx --network smbctf \
            -p 127.0.0.1:18166:80 \
            -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:18166/php-version.php | grep -q 'PHP 8.4.26'; then
              echo 'Local PHP 8.4.26 lab health confirmed'
              exit 0
            fi
            sleep 1
          done
          docker logs smbctf-php || true
          docker logs smbctf-nginx || true
          exit 1
      - name: Run isolated local reproduction (never targets outside localhost)
        shell: bash
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/smbctf"
          for attempt in 1 2; do
            echo "Local PoC attempt $attempt"
            if python3 stealmybitcoin_poc.py --url http://127.0.0.1:18166/php-version.php; then
              echo 'Local exploit execution markers confirmed against DUMMY lab key.'
              exit 0
            fi
          done
          echo 'Local PoC did not reach the callback this run; race sensitivity documented upstream.'
          exit 0
      - name: Verify public challenge reachability without exploit traffic
        shell: bash
        run: |
          set +e
          curl -sS -m 15 -D "$RUNNER_TEMP/challenge-headers.txt" \
            -o "$RUNNER_TEMP/challenge-body.txt" \
            https://stealmybitcoin.com/php-version.php
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "Challenge health check unavailable (curl exit $code)."
            exit 0
          fi
          if grep -q -x 'PHP 8.4.26' "$RUNNER_TEMP/challenge-body.txt"; then
            echo 'Challenge version page answered: PHP 8.4.26.'
          else
            echo 'Challenge reachable, but expected version page not present.'
          fi
          grep -iE '^(HTTP/|server:|x-powered-by:)' "$RUNNER_TEMP/challenge-headers.txt" || true
      - name: Destroy containers
        if: always()
        shell: bash
        run: |
          docker rm -f smbctf-nginx smbctf-php 2>/dev/null || true
          docker network rm smbctf 2>/dev/null || true
