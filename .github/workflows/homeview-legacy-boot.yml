name: HomeView Legacy Boot - EFI and ARM TCG research

on:
  push:
    branches:
      - temp/homeview-legacy-boot
    paths:
      - '.github/workflows/homeview-legacy-boot.yml'
      - 'homeview-legacy/scripts/build-image.sh'
      - 'homeview-legacy/scripts/launch-homeview.sh'
      - 'homeview-legacy/scripts/run-darwin.sh'
      - 'homeview-legacy/scripts/test-arm-uefi.sh'
      - 'homeview-legacy/scripts/test-uefi.sh'
      - 'homeview-legacy/scripts/native_startup_gate.py'
      - 'homeview-legacy/scripts/firmware_probe.py'
      - 'homeview-legacy/tests/test_firmware_probe.py'
      - 'homeview-legacy/tests/test_ota_probe.py'
      - 'homeview-legacy/scripts/scan_full_pumpkin_diff.py'
      - 'homeview-legacy/tests/test_pumpkin_full_scan.py'
  workflow_dispatch:

concurrency:
  group: homeview-legacy-x86-usb-temp
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit and shell syntax tests
        run: |
          python3 -m unittest discover -s homeview-legacy/tests -v
          bash -n homeview-legacy/scripts/*.sh
      - name: Verify real HomeView OTA metadata without downloading firmware
        run: |
          mkdir -p reports
          python3 homeview-legacy/scripts/firmware_probe.py --output reports/firmware-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homeview-firmware-preflight
          path: reports/
          if-no-files-found: ignore

  intel-macos:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Intel Mac host compatibility
        run: |
          uname -m
          test "$(uname -m)" = x86_64
          python3 -m unittest discover -s homeview-legacy/tests -v
          echo "The Apple-Silicon-only vphone VM does not run on this runner."

  arm-uefi-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM emulator and ARM UEFI
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-efi-aarch64
      - name: Execute ARM64 UEFI in QEMU TCG
        run: bash homeview-legacy/scripts/test-arm-uefi.sh arm64-uefi.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-uefi-serial
          path: arm64-uefi.log
          if-no-files-found: ignore

  native-homeview-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for original Apple SetupAssistant + BreadBoard screenshots
        run: |
          python3 homeview-legacy/scripts/native_startup_gate.py \
            --evidence native-evidence --output native-homeview-gate.json --require-pass
          python3 - <<'PY'
          import json
          data = json.load(open('native-homeview-gate.json'))
          print('Native HomeView status:', data['result'])
          if not data['native_homeview_verified']:
              print('Native HomeView startup not verified; gate correctly remains red.')
          PY
      - name: Publish explicit blocked/pass report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeview-native-acceptance-status
          path: native-homeview-gate.json

  apple-emulator:
    uses: ./.github/workflows/homeview-apple-emulator.yml

  usb-build-and-boot:
    needs: [firmware-metadata, apple-emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled Apple-specific Darwin QEMU (same workflow)
        uses: actions/download-artifact@v4
        with:
          name: apple-sptm-qemu-ubuntu2404-amd64
          path: emulator
      - name: Restore permission, install runtime libraries, and check Darwin QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapstone4 libslirp0 libfdt1 libpixman-1-0 libgnutls30t64
          test -s emulator/qemu-system-aarch64-sptm
          chmod 755 emulator/qemu-system-aarch64-sptm
          ldd emulator/qemu-system-aarch64-sptm | tee emulator/ldd-on-builder.txt
          if grep -q 'not found' emulator/ldd-on-builder.txt; then
            echo "Unresolved QEMU ELF dependency on builder"
            exit 1
          fi
          ./emulator/qemu-system-aarch64-sptm -M help | grep -Eq '(^|[[:space:]])darwin([[:space:]]|$)'
      - name: Install image builder, video capture and x86 UEFI emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap parted dosfstools e2fsprogs \
            grub-efi-amd64-bin grub2-common qemu-system-x86 ovmf zstd socat
      - name: Build real x86 EFI Linux USB image (not Apple firmware)
        run: |
          mkdir -p out
          QEMU_SPTM_BIN="$PWD/emulator/qemu-system-aarch64-sptm" \
            bash homeview-legacy/scripts/build-image.sh out/homeview-legacy.raw
      - name: Boot entire USB under emulated Intel PC and check launcher
        run: bash homeview-legacy/scripts/test-uefi.sh out/homeview-legacy.raw out/x86-uefi-serial.log out/x86-uefi-console.png
      - name: Verify booted image has SPTM-capable Darwin emulator and visual evidence
        run: |
          test -s out/x86-uefi-console.png
          python3 - <<'PY'
          import json
          report = json.load(open('out/x86-uefi-console.json'))
          assert report['screen_is_synthetic'] is False
          assert report['genuine_apple_homeview_breadboard'] is False
          assert report['width'] > 0 and report['height'] > 0
          print('QEMU host boot screenshot captured; genuine HomeView still unsupported')
          PY
      - name: Upload real QEMU VGA screenshot separately for review
        uses: actions/upload-artifact@v4
        with:
          name: homeview-efi-vga-visual-proof
          path: |
            out/x86-uefi-console.png
            out/x86-uefi-console.json
            out/x86-uefi-serial.log
          if-no-files-found: error
          retention-days: 7
      - name: Compress validated disk image
        run: |
          sha256sum out/homeview-legacy.raw > out/homeview-legacy.raw.sha256
          zstd -T2 -5 --rm out/homeview-legacy.raw -o out/homeview-legacy.raw.zst
      - name: Upload only validated compressed image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: homeview-legacy-research-usb
          path: |
            out/*.zst
            out/*.sha256
            out/*log
            out/*.png
            out/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload failed boot serial logs (never 5 GiB raw disk)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: homeview-legacy-failure-logs
          path: |
            out/*log
            out/*.png
            out/*.json
          if-no-files-found: ignore
