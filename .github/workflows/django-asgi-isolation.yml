name: Django Sep24 ASGI isolation

on:
  workflow_dispatch:
  push:
    branches:
      - h1-django-asgi-isolation-sep24

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: parent-before-sep24
            install: git+https://github.com/django/django.git@9d977aaa2d037cf0a6e2fcad40763305fe88cfda
          - name: sep24-change
            install: git+https://github.com/django/django.git@a013c821ea7838a953869615b0bdcfdb298cc09f
          - name: current-main
            install: git+https://github.com/django/django.git@9e06baf2e4dd17834b5deaf3a3e6ae3bff2fcf26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Django target
        run: python -m pip install "${{ matrix.install }}"
      - name: Run isolation test
        shell: bash
        run: |
          set -o pipefail
          python django-asgi-middleware-isolation.py | tee evidence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asgi-isolation-${{ matrix.name }}
          path: evidence.txt
