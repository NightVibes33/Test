name: A18BreakRW
options:
  bundleIdPrefix: dev.nightvibes33
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  A18BreakRW:
    type: application
    platform: iOS
    sources:
      - path: A18BreakRW/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nightvibes33.a18break.rwprobe
        INFOPLIST_KEY_CFBundleDisplayName: A18Break RW
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
schemes:
  A18BreakRW:
    build:
      targets:
        A18BreakRW: all
